version: 2

updates:
  # ── Python dependencies ────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Group minor + patch updates into a single PR to reduce noise
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # PyInstaller compatibility: avoid auto-bumping Python past what PyInstaller supports
    ignore:
      - dependency-name: "pyinstaller"
        update-types: ["version-update:semver-major"]

  # ── Support bot (its own pyproject.toml / poetry.lock) ─────────────────────
  # Deployed and holding the Discord token, yet it was outside the root entry's reach.
  - package-ecosystem: "pip"
    directory: "/services/support-bot"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      support-bot-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ── Documentation chatbot Worker (npm) ─────────────────────────────────────
  # Unwatched until 2026-09-28: a high-severity alert on sharp could not become a PR.
  - package-ecosystem: "npm"
    directory: "/poc/doc-chatbot/worker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      chatbot-worker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
