version: 2

updates:
  # ── Python dependencies ────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Group minor + patch updates into a single PR to reduce noise
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # PyInstaller compatibility: avoid auto-bumping Python past what PyInstaller supports
    ignore:
      - dependency-name: "pyinstaller"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
