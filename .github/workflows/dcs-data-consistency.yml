name: DCS Data Consistency

# Regenerate the pure, datamine-sourced DCS artifacts against the pinned ref and
# fail if the committed files drift from the generator output (forgot to run
# `veaf-build update-dcs-data`, or hand-edited a generated file).
#
# Only PURE artifacts are guarded here. The radio specs are a hybrid artifact
# (generated base + manual `dcs_rejects_on_load` overlays + bilingual doc) and
# therefore cannot use a regenerate-equality check.

on:
  push:
    branches: [develop-v6, master]
    paths:
      - "src/python/veaf-tools/veaf_libs/data/dcs-countries.yaml"
      - "src/python/veaf-tools/veaf_libs/data/dcsUnits.yaml"
      - "src/scripts/veaf/dcsUnits.lua"
      - "veaf_build/dcs_data/**"
      - ".github/workflows/dcs-data-consistency.yml"
  pull_request:
    paths:
      - "src/python/veaf-tools/veaf_libs/data/dcs-countries.yaml"
      - "src/python/veaf-tools/veaf_libs/data/dcsUnits.yaml"
      - "src/scripts/veaf/dcsUnits.lua"
      - "veaf_build/dcs_data/**"
      - ".github/workflows/dcs-data-consistency.yml"

jobs:
  dcs-data-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --without build --all-extras

      - name: Regenerate the pure artifacts against the pinned ref
        run: poetry run veaf-build update-dcs-data --countries --units

      - name: Fail if a committed artifact drifts from the generator
        run: |
          if ! git diff --exit-code \
            src/python/veaf-tools/veaf_libs/data/dcs-countries.yaml \
            src/python/veaf-tools/veaf_libs/data/dcsUnits.yaml \
            src/scripts/veaf/dcsUnits.lua; then
            echo "::error::A generated DCS artifact is out of date or hand-edited. Run 'veaf-build update-dcs-data --countries --units' and commit the result (bump DATAMINE_REF first if intended)."
            exit 1
          fi
