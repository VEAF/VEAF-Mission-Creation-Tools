name: Rebuild docs chatbot index

# Rebuilds the Vectorize embeddings index for the documentation chatbot whenever the docs change,
# so answers stay fresh. Requires three repository secrets:
#   GEMINI_API_KEY        — Google Gemini API key (embeddings)
#   CLOUDFLARE_API_TOKEN  — token with Vectorize edit permission
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
# Until those are set this workflow is a no-op-by-failure; it does not affect the docs deploy.

on:
  push:
    branches:
      - develop-v6
    paths:
      - "doc/**"
      - "poc/doc-chatbot/worker/scripts/build-index.mjs"
      - ".github/workflows/docs-chatbot-index.yml"
  workflow_dispatch:

concurrency:
  group: docs-chatbot-index
  cancel-in-progress: false

jobs:
  reindex:
    name: Build & upsert the chatbot index
    runs-on: ubuntu-latest
    if: github.repository == 'VEAF/VEAF-Mission-Creation-Tools'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: poc/doc-chatbot/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build the embeddings index
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/build-index.mjs

      - name: Upsert into Vectorize
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler vectorize upsert veaf-docs --file vectors.ndjson
