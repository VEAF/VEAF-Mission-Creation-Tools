name: Deploy Docs

# Deployments queue instead of colliding. Every run of this workflow fetches `gh-pages`
# from the external VEAF/documentation repository, builds, and pushes it back; two at
# once means the second fetched before the first landed, and its push is rejected with
# `! [rejected] gh-pages -> gh-pages (fetch first)`.
#
# The window is not theoretical — it is built into the release procedure, which pushes
# the `v*` tag and then back-merges to `develop` minutes later. It cost the 6.13.0
# release a red run, and the 6.11.0 documentation was never published at all for the
# same reason.
#
# `cancel-in-progress: false` is the point: cancelling would drop a deployment on the
# floor, which is the very outcome to avoid. Queuing costs a couple of minutes.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

on:
  push:
    branches:
      - develop        # → the "dev" alias
    # `master` is deliberately absent: released documentation is published by the `v*` tag
    # (see the deploy steps), so a push here would run the whole job and deploy nothing.
    tags:
      - "v*"           # → the versioned release + the "latest" alias

  # Republish a version's documentation without moving its tag. Re-running the tag build would
  # rebuild from the *tagged* commit — so a fix landed after the tag (e.g. the footer version
  # stamper) would never reach the published pages. This path builds from the branch you pick and
  # deploys under the version you name.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)publish, e.g. 6.12.0. Leave empty to deploy the 'dev' alias."
        required: false
        type: string
      set_latest:
        description: "Also move the 'latest' alias (and the site default) to that version"
        required: false
        type: boolean
        default: true

jobs:
  deploy-docs:
    name: Build and deploy MkDocs
    runs-on: ubuntu-latest
    if: github.repository == 'VEAF/VEAF-Mission-Creation-Tools'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # mike needs full history to manage the gh-pages branch correctly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install docs dependencies
        run: poetry install --with docs --no-root

      # The repository keeps a readable `6.11.x`-style placeholder in the pages that display a
      # version; the published site must state the version it was generated from. Stamped on this
      # throwaway checkout only — nothing is committed back (DOC-QUALITY-GATE). Run as a plain
      # script: it is stdlib-only, so it needs neither the project installed nor its deps.
      # On a manual republish, the version being published is NOT the working tree's version:
      # republishing 6.12.0 from a 6.12.1 tree would stamp 6.12.1 onto the 6.12.0 pages. Passed
      # through an env var rather than interpolated into the shell — inputs are untrusted.
      - name: Stamp the shipped version into the docs headers
        env:
          FORCED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$FORCED_VERSION" ]; then
            python veaf_build/docs_version_stamp.py --version "$FORCED_VERSION"
          else
            python veaf_build/docs_version_stamp.py
          fi

      - name: Configure git identity (required by mike)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure external docs remote
        # actions/checkout injects GITHUB_TOKEN as a LOCAL http.extraheader in
        # .git/config (not global). Unset it at local scope so the PAT embedded
        # in the remote URL is used when mike pushes to the external docs repo.
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          git config --local --unset-all \
            "http.https://github.com/.extraheader" || true
          git remote add ext-docs \
            "https://x-access-token:${DOCS_DEPLOY_TOKEN}@github.com/VEAF/documentation.git"
          git fetch ext-docs gh-pages --depth=1 || true

      # `github.event_name == 'push'` matters: without it, a manual republish of 6.12.0 run from
      # `develop` would also redeploy the "dev" alias, which is not what was asked for.
      - name: Deploy docs (develop → alias "dev")
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: poetry run mike deploy --update-aliases --push --remote ext-docs dev

      - name: Republish a version (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        env:
          VERSION: ${{ github.event.inputs.version }}
          SET_LATEST: ${{ github.event.inputs.set_latest }}
        run: |
          if [ "$SET_LATEST" = "true" ]; then
            poetry run mike deploy --update-aliases --push --remote ext-docs "$VERSION" latest
            poetry run mike set-default --push --remote ext-docs latest
          else
            poetry run mike deploy --update-aliases --push --remote ext-docs "$VERSION"
          fi

      - name: Deploy the "dev" alias (manual, no version given)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version == ''
        run: poetry run mike deploy --update-aliases --push --remote ext-docs dev

      # No step for a plain push to `master`: `mike deploy latest` would create a *version*
      # literally named "latest", which then collides with the `latest` **alias** the tag step
      # below needs — mike refuses with `alias 'latest' already specified as a version`, and
      # the release documentation never gets published (this is what left the site on 6.10.0
      # while 6.11.0 had shipped). Released documentation is deployed by the `v*` tag only,
      # which is also the single source of truth for what "latest" means.

      - name: Deploy docs (tag → versioned release + alias "latest")
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          poetry run mike deploy --update-aliases --push --remote ext-docs "$VERSION" latest
          poetry run mike set-default --push --remote ext-docs latest

      - name: Deploy landing page to docs root
        run: |
          git fetch ext-docs gh-pages
          git worktree add /tmp/gh-pages FETCH_HEAD
          cp src/docs-landing/index.html /tmp/gh-pages/index.html
          cd /tmp/gh-pages
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "chore: update landing page [skip ci]"
            git push ext-docs HEAD:gh-pages
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/gh-pages --force
