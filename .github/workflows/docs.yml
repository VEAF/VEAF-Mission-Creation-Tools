name: Deploy Docs

on:
  push:
    branches:
      - develop-v6
      - main
    tags:
      - "v*"

jobs:
  deploy-docs:
    name: Build and deploy MkDocs
    runs-on: ubuntu-latest
    if: github.repository == 'VEAF/VEAF-Mission-Creation-Tools'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # mike needs full history to manage the gh-pages branch correctly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install docs dependencies
        run: poetry install --with docs --no-root

      - name: Configure git identity (required by mike)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure external docs remote
        # actions/checkout injects GITHUB_TOKEN as a LOCAL http.extraheader in
        # .git/config (not global). Unset it at local scope so the PAT embedded
        # in the remote URL is used when mike pushes to the external docs repo.
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          git config --local --unset-all \
            "http.https://github.com/.extraheader" || true
          git remote add ext-docs \
            "https://x-access-token:${DOCS_DEPLOY_TOKEN}@github.com/VEAF/VEAF-Mission-Creation-Tools-v6.git"
          git fetch ext-docs gh-pages --depth=1 || true

      - name: Deploy docs (develop-v6 → alias "dev")
        if: github.ref == 'refs/heads/develop-v6'
        run: poetry run mike deploy --update-aliases --push --remote ext-docs dev

      - name: Deploy docs (main → alias "latest")
        if: github.ref == 'refs/heads/main'
        run: poetry run mike deploy --update-aliases --push --remote ext-docs latest

      - name: Deploy docs (tag → versioned release + alias "latest")
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          poetry run mike deploy --update-aliases --push --remote ext-docs "$VERSION" latest
          poetry run mike set-default --push --remote ext-docs latest
