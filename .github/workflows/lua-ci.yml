name: Lua CI

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Lua 5.1 unit tests (luaunit)
  # ---------------------------------------------------------------------------
  lua-unit-tests:
    name: Lua Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1

      - name: Run test suite
        run: |
          FAILED=0
          for f in $(ls test/lua/test_*.lua | sort); do
            echo ""
            echo "--- $(basename "$f") ---"
            lua5.1 "$f" || FAILED=1
          done
          echo ""
          if [ "$FAILED" -eq 0 ]; then
            echo "All tests passed."
          else
            echo "One or more test suites failed."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Luacheck — static analysis (undefined globals, unused vars, shadowing)
  # ---------------------------------------------------------------------------
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Lua 5.1 + luacheck (via LuaRocks)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1 liblua5.1-dev luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        run: luacheck src/scripts/veaf/ --config .luacheckrc

  # ---------------------------------------------------------------------------
  stylua-check:
    name: StyLua Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check formatting with StyLua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: "2.4.0"
          args: --check src/scripts/veaf/

  # ---------------------------------------------------------------------------
  # Lua line coverage (luacov) with a ratchet floor — number only ever goes up
  # ---------------------------------------------------------------------------
  lua-coverage:
    name: Lua Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Lua 5.1 + luacov (via LuaRocks)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1 liblua5.1-dev luarocks
          sudo luarocks install luacov

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --without build --all-extras

      - name: Run Lua tests with coverage floor
        run: poetry run test-lua --cov-fail-under 69
