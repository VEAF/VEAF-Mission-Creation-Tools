name: Python Quality

on:
  push:
    paths:
      - "src/python/**"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"
  pull_request:
    paths:
      - "src/python/**"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        # Install runtime + dev deps; exclude only the 'build' group (pyinstaller)
        # --all-extras installs lupa (lua extra) needed by miz_tools / luadata
        run: poetry install --without build --all-extras

      - name: Lint (ruff check)
        run: poetry run ruff check src/python/veaf-tools

      - name: Format check (ruff format)
        run: poetry run ruff format --check src/python/veaf-tools

      - name: Type check (mypy)
        run: poetry run mypy src/python/veaf-tools

      - name: Tests (pytest + coverage)
        run: poetry run pytest --cov=src/python/veaf-tools --cov-report=xml --cov-report=term-missing:skip-covered --cov-fail-under=15

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
