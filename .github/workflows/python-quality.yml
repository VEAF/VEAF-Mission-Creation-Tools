name: Python Quality

# The trigger paths must cover everything the gate below checks, or widening the gate is a no-op:
# a change confined to test/python/ would not run the job that now lints it.
on:
  push:
    branches: [develop, master]
    paths:
      - "src/python/**"
      - "test/python/**"
      - "veaf_build/**"
      - "pyproject.toml"
      # A bump that fits the existing constraint changes ONLY this file: without it here, the suite
      # never runs for such a PR, which then reads green off the Lua and docs checks. A *major* is
      # covered by pyproject.toml above, which is why the gap only ever showed on minors.
      - "poetry.lock"
      - ".github/workflows/python-quality.yml"
  pull_request:
    paths:
      - "src/python/**"
      - "test/python/**"
      - "veaf_build/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/python-quality.yml"

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        # Install runtime + dev deps; exclude only the 'build' group (pyinstaller)
        # --all-extras installs lupa (lua extra) needed by miz_tools / luadata
        run: poetry install --without build --all-extras

      # The whole Python tree, not just the shipped package: test/python/ was under no gate at all,
      # which is how a `ruff --fix` run in passing silently rewrote unrelated test files twice.
      # veaf_build/ was already conforming, so including it costs nothing and stops it drifting.
      - name: Lint (ruff check)
        run: poetry run ruff check src/python/ test/python/ veaf_build/

      - name: Format check (ruff format)
        run: poetry run ruff format --check src/python/ test/python/ veaf_build/

      - name: Type check (mypy)
        run: poetry run mypy src/python/veaf-tools

      - name: Tests (pytest + coverage)
        run: poetry run pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Does the packaged executable start?
  #
  # Nothing above can answer that: every test runs from the checkout, where an import
  # PyInstaller cannot see resolves perfectly. Three defects shipped through that blind
  # spot — the conversion profiles (`unknown conversion profile: foothold`),
  # third_party_mods.json, and 6.15.0's lazy `mission_builder`, which made the exe die on
  # its first command for every user of the 6.15 line. Each was found by a mission maker.
  #
  # The tooling is only distributed as this binary, so "it imports and runs one command"
  # is the cheapest test worth having. It is a separate job because it needs the `build`
  # dependency group (pyinstaller) the gate above deliberately excludes.
  # ---------------------------------------------------------------------------
  exe-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (including PyInstaller)
        run: poetry install --with build --all-extras

      - name: Build the standalone executable
        run: poetry run veaf-build build-standalone --version 0.0.0

      # `--help` walks the whole command tree, so it imports every command module — which is
      # exactly what the 6.15.0 defect broke. `generate-config` then runs real code and
      # writes a real file, covering more than the import graph.
      - name: The executable starts
        run: ./dist/veaf-tools --help

      - name: The executable runs a command
        run: |
          mkdir -p smoke
          cd smoke
          ../dist/veaf-tools generate-config --output .
          test -s mission.yaml
