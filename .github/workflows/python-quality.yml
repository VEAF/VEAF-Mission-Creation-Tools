name: Python Quality

# The trigger paths must cover everything the gate below checks, or widening the gate is a no-op:
# a change confined to test/python/ would not run the job that now lints it.
on:
  push:
    branches: [develop, master]
    paths:
      - "src/python/**"
      - "test/python/**"
      - "veaf_build/**"
      - "pyproject.toml"
      # A bump that fits the existing constraint changes ONLY this file: without it here, the suite
      # never runs for such a PR, which then reads green off the Lua and docs checks. A *major* is
      # covered by pyproject.toml above, which is why the gap only ever showed on minors.
      - "poetry.lock"
      - ".github/workflows/python-quality.yml"
  pull_request:
    paths:
      - "src/python/**"
      - "test/python/**"
      - "veaf_build/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/python-quality.yml"

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      # veaf-logs is a Qt application: its tests run headless (QT_QPA_PLATFORM=offscreen,
      # set by their conftest), but the offscreen plugin still links against these.
      - name: Install the Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        # Install runtime + dev deps; exclude only the 'build' group (pyinstaller)
        # --all-extras installs lupa (lua extra) needed by miz_tools / luadata,
        # and PySide6 (logs extra) needed by veaf-logs
        run: poetry install --without build --all-extras

      # The whole Python tree, not just the shipped package: test/python/ was under no gate at all,
      # which is how a `ruff --fix` run in passing silently rewrote unrelated test files twice.
      # veaf_build/ was already conforming, so including it costs nothing and stops it drifting.
      - name: Lint (ruff check)
        run: poetry run ruff check src/python/ test/python/ veaf_build/

      - name: Format check (ruff format)
        run: poetry run ruff format --check src/python/ test/python/ veaf_build/

      - name: Type check (mypy)
        run: poetry run mypy src/python/veaf-tools

      - name: Tests (pytest + coverage)
        run: poetry run pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Does the packaged executable start?
  #
  # Nothing above can answer that: every test runs from the checkout, where an import
  # PyInstaller cannot see resolves perfectly. Three defects shipped through that blind
  # spot — the conversion profiles (`unknown conversion profile: foothold`),
  # third_party_mods.json, and 6.15.0's lazy `mission_builder`, which made the exe die on
  # its first command for every user of the 6.15 line. Each was found by a mission maker.
  #
  # The tooling is only distributed as this binary, so "it imports and runs one command"
  # is the cheapest test worth having. It is a separate job because it needs the `build`
  # dependency group (pyinstaller) the gate above deliberately excludes.
  # ---------------------------------------------------------------------------
  exe-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (including PyInstaller)
        run: poetry install --with build --all-extras

      - name: Build the standalone executable
        run: poetry run veaf-build build-standalone --version 0.0.0

      # `--help` walks the whole command tree, so it imports every command module — which is
      # exactly what the 6.15.0 defect broke. `generate-config` then runs real code and
      # writes a real file, covering more than the import graph.
      - name: The executable starts
        run: ./dist/veaf-tools --help

      - name: The executable runs a command
        run: |
          mkdir -p smoke
          cd smoke
          ../dist/veaf-tools generate-config --output .
          test -s mission.yaml

      # The themed tree the documentation describes must exist in the **binary**, not only in
      # a checkout: it did not, from 6.14.0 until FIX-EXE-COMMAND-TREE, because the entry
      # script PyInstaller reads was a copy of `main()` that never grew `build_cli_tree`. The
      # flat alias is checked in the same breath — the tree keeps every older command line
      # working, and that promise is only worth what a test says about it.
      - name: The executable exposes the themed command tree, and the flat aliases
        run: |
          ./dist/veaf-tools content extract-aircraft-groups --help
          ./dist/veaf-tools extract-aircraft-groups --help
          ./dist/veaf-tools convert v5 --help

  # ---------------------------------------------------------------------------
  # Does the veaf-logs executable start?
  #
  # Same blind spot as above, and it has already bitten: the first build of this
  # binary died instantly because its entry point used a relative import, which
  # resolves fine from the checkout and not at all from a PyInstaller bundle. The
  # window is the product here, so "it opens one and reads a log" is the test.
  # ---------------------------------------------------------------------------
  veaf-logs-exe-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (including PyInstaller)
        run: poetry install --with build --all-extras

      - name: Build the veaf-logs executable
        run: poetry run pyinstaller veaf-logs.spec --noconfirm

      # A window has no --help to walk, so we hand it a real log and check that it
      # is still alive a few seconds later. A bundle whose imports are broken dies
      # at once, which is exactly what this catches.
      - name: The executable opens a log and keeps running
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cat > smoke.log <<'LOG'
          2026-08-31 11:50:40.872 ERROR   APP (Main): Corrupt damage model.
          LOG
          timeout 20 ./dist/veaf-logs smoke.log && code=$? || code=$?
          # 124 is what `timeout` returns when it had to stop a healthy process.
          test "$code" = "124" || { echo "veaf-logs exited on its own (code $code)"; exit 1; }
