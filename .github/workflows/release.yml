name: Release

# Triggered when a versioned release tag is pushed.
# The developer creates and pushes the tag locally (lightweight or annotated):
#   git tag published-v6.0.6
#   git push origin published-v6.0.6
# GPG signing is optional — build integrity is verified by GitHub Actions.
# This workflow then:
#   1. Builds the executables and release package
#   2. Creates the GitHub Release and uploads assets (using committed RELEASE_NOTES.md)
#   3. Moves the published-latest floating tag
on:
  push:
    tags:
      - "published-v*"

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest  # required: PyInstaller must produce Windows .exe

    permissions:
      contents: write  # needed to create releases, push tags

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. published-v6.0.6 or published-v6.9.21-rc1
          VERSION="${TAG#published-v}"      # e.g. 6.0.6 / 6.9.21-rc1
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A semver pre-release suffix (a '-' in the version, e.g. -rc1) marks a pre-release:
          # publish it as such and leave the floating published-latest tag untouched.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (including PyInstaller)
        run: poetry install --with build --all-extras

      - name: Build release package
        run: poetry run veaf-build build --version ${{ steps.version.outputs.version }}

      - name: Publish to GitHub
        shell: bash
        run: |
          FLAG=""
          [[ "${{ steps.version.outputs.prerelease }}" == "true" ]] && FLAG="--prerelease"
          poetry run veaf-build publish --version "${{ steps.version.outputs.version }}" --ci --force $FLAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only a real release advances the floating published-latest tag; a pre-release leaves
      # production users on the previous stable (they opt in with --tag published-v<version>).
      - name: Move published-latest tag
        if: steps.version.outputs.prerelease != 'true'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag -f published-latest "$TAG"
          git push origin -f published-latest

  # ---------------------------------------------------------------------------
  # Cross-platform standalone binaries.
  # PyInstaller cannot cross-compile, so each OS/arch builds on its own runner and
  # uploads its `veaf-tools` + `veaf-tools-updater` binaries to the Release above.
  # The Windows flow (exe + updater + published.zip) is unchanged.
  # ---------------------------------------------------------------------------
  standalone:
    name: Standalone ${{ matrix.asset }}
    needs: release
    runs-on: ${{ matrix.runner }}
    # Intel macOS (macos-13) is a shrinking, scarce runner pool that can sit queued for
    # a long time. Mark only that variant best-effort: continue-on-error keeps a slow or
    # failed Intel job from turning the release red or blocking it. Linux/arm64 stay
    # blocking (must be reliable). timeout-minutes caps execution time once a runner is
    # assigned — it does NOT bound the queue wait, which GitHub alone controls.
    continue-on-error: ${{ matrix.optional || false }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04   # lower glibc → broad distro compatibility
            asset: veaf-tools-linux-x86_64
            updater_asset: veaf-tools-updater-linux-x86_64
          - runner: macos-latest   # Apple Silicon
            asset: veaf-tools-macos-arm64
            updater_asset: veaf-tools-updater-macos-arm64
          - runner: macos-13       # Intel — best-effort (scarce runner pool)
            asset: veaf-tools-macos-x86_64
            updater_asset: veaf-tools-updater-macos-x86_64
            optional: true

    permissions:
      contents: write  # needed to upload assets to the release

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. published-v6.0.6 or published-v6.9.21-rc1
          VERSION="${TAG#published-v}"      # e.g. 6.0.6 / 6.9.21-rc1
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (including PyInstaller)
        run: poetry install --with build --all-extras

      - name: Build standalone veaf-tools + updater binaries
        run: poetry run veaf-build build-standalone --with-updater --version ${{ steps.version.outputs.version }}

      - name: Rename binaries for the assets
        shell: bash
        run: |
          mv dist/veaf-tools "dist/${{ matrix.asset }}"
          mv dist/veaf-tools-updater "dist/${{ matrix.updater_asset }}"

      - name: Upload binaries to the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "dist/${{ matrix.asset }}" "dist/${{ matrix.updater_asset }}" --clobber
          # Mirror onto the floating published-latest release too: it is the user-facing
          # "Latest" and the tag the Unix updater queries by default, so the binaries must
          # be there as well (the Windows release job uploads its own assets to both, but
          # these standalone jobs run after it and must mirror their own). Skip for a
          # pre-release: published-latest must stay on the previous stable.
          if [[ "${{ steps.version.outputs.prerelease }}" != "true" ]] && gh release view published-latest >/dev/null 2>&1; then
            gh release upload published-latest \
              "dist/${{ matrix.asset }}" "dist/${{ matrix.updater_asset }}" --clobber
          fi
