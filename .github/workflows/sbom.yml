name: SBOM

# Generates a Software Bill of Materials (CycloneDX JSON format) for the
# Python dependencies embedded in the published veaf-tools.exe / veaf-tools-updater.exe.
# Uploaded as an artifact on develop pushes. The release's own SBOM is uploaded by
# release.yml, after `veaf-build publish --force`: that step deletes and recreates the release,
# so an SBOM attached here on the tag was lost (6.35.0 and 6.36.0 shipped without one).
on:
  push:
    branches: [develop]

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --without build --all-extras

      - name: Generate CycloneDX SBOM
        run: |
          poetry run pip install cyclonedx-bom
          poetry run cyclonedx-py poetry --of JSON -o sbom.cyclonedx.json
          echo "Generated SBOM:"
          python -c "import json,sys; d=json.load(open('sbom.cyclonedx.json')); print(f'  {len(d[\"components\"])} components')"

      - name: Upload SBOM as artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.cyclonedx.json
          retention-days: 90
