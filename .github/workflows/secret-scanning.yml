name: Secret Scanning

on:
  push:
    branches: [develop-v6, main]
  pull_request:

env:
  # Pinned gitleaks CLI version — bump deliberately.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history needed for gitleaks to scan all commits on push
          fetch-depth: 0

      - name: Install gitleaks CLI
        # The gitleaks/gitleaks-action wrapper requires a paid licence for GitHub
        # organisations (GITLEAKS_LICENSE); the CLI binary is MIT-licensed and free,
        # organisations included. Install it straight from the official release.
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        # `git` scans the whole history (matches the previous fetch-depth: 0 behaviour);
        # --redact keeps any finding out of the public logs. Non-zero exit on a leak.
        run: gitleaks git --config .gitleaks.toml --redact --verbose
