name: Support Bot

# `services/support-bot/` is its own Python project, deployed independently of the tools release. The
# repository-wide gate (`Python Quality`) does not cover it — `ruff check src/python/ test/python/
# veaf_build/` and `mypy src/python/veaf-tools` are scoped to the shipped package — so the service
# carries its own gate here rather than being widened into one that asserts on a different tree.
#
# The filter must cover everything the suite asserts on, not only the folder it lives in — a path a
# test reads but does not trigger on is a decorative assertion. Measured on this repository:
# #877, #875 and #866 each merged without ever running the Python gate, for that exact reason.
#   .gitignore      test_git_really_ignores_the_real_environment_file /
#                   test_git_does_not_ignore_the_documented_example — the secret rule lives in the
#                   ROOT .gitignore and has to (a nested one is itself ignored), so a reshuffle of
#                   those lines would un-guard the service's `.env` with every check still green.
#   pyproject.toml  test_the_service_version_is_its_own (the root one, read to prove the service is
#                   NOT in the tools version lockstep).
#   doc/**          test_the_checked_in_index_is_what_the_generator_produces — the bot links the
#                   documentation pages it cites from a generated index; a page renamed or retitled
#                   without running this job leaves the bot citing a title that no longer exists.
on:
  push:
    branches: [develop, master]
    paths:
      - "services/support-bot/**"
      - ".github/workflows/support-bot-ci.yml"
      - ".gitignore"
      - "pyproject.toml"
      - "doc/**"
  # GitHub Actions does not resolve YAML anchors, so this list is duplicated on purpose; the two are
  # kept identical by `test/python/test_ci_trigger_paths.py`.
  pull_request:
    paths:
      - "services/support-bot/**"
      - ".github/workflows/support-bot-ci.yml"
      - ".gitignore"
      - "pyproject.toml"
      - "doc/**"

defaults:
  run:
    working-directory: services/support-bot

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Lint (ruff check)
        run: poetry run ruff check veaf_support_bot tests

      - name: Format check (ruff format)
        run: poetry run ruff format --check veaf_support_bot tests

      # Stricter than the repository root's mypy: the package is new, so it starts clean.
      - name: Type check (mypy)
        run: poetry run mypy

      - name: Tests (pytest + coverage)
        run: poetry run pytest

  # ---------------------------------------------------------------------------
  # The other half of "runs identically when launched directly and when containerised".
  #
  # The quality job proves the code; it cannot prove the image. Everything that only exists in the
  # container is asserted here: that a misconfigured container refuses to start rather than idling,
  # that the health endpoints answer from outside and disagree the way they should in a dry run,
  # that Docker's own health check actually runs, that the quota counters have somewhere to live,
  # and — the one that matters most — that SIGTERM reaches the process, so the clean shutdown
  # actually runs on `docker stop` instead of the container being killed ten seconds later.
  # ---------------------------------------------------------------------------
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t veaf-support-bot:ci .

      - name: A misconfigured container fails loudly instead of idling
        run: |
          set +e
          output=$(docker run --rm veaf-support-bot:ci 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" = "78" || { echo "expected EX_CONFIG (78), got $code"; exit 1; }
          echo "$output" | grep -q "SUPPORT_BOT_DISCORD_TOKEN is required"
          # The Worker refuses this bot's client mode without it, so it is required at startup
          # rather than discovered on the first question.
          echo "$output" | grep -q "SUPPORT_BOT_WORKER_SECRET is required"

      # The App does not exist yet, so "no App at all" is the normal state and must stay silent.
      # "Some of an App", though, is a container that would take bug reports for a week and fail to
      # file every one of them — the exact failure that has to happen at startup instead.
      - name: Half a GitHub App fails the same way a missing token does
        run: |
          set +e
          # A key IS supplied here, so the leak check below has something real to catch: a
          # configuration error is printed at CRITICAL straight into a log collector, and the one
          # variable in this set that certainly holds a credential is this one.
          output=$(docker run --rm \
            -e SUPPORT_BOT_DISCORD_TOKEN=x \
            -e SUPPORT_BOT_DISCORD_GUILD_ID=1 \
            -e SUPPORT_BOT_WORKER_SECRET=x \
            -e SUPPORT_BOT_GITHUB_APP_ID=123456 \
            -e "SUPPORT_BOT_GITHUB_PRIVATE_KEY=-----BEGIN RSA PRIVATE KEY-----MIIEnotarealkey-----END RSA PRIVATE KEY-----" \
            veaf-support-bot:ci 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" = "78" || { echo "expected EX_CONFIG (78), got $code"; exit 1; }
          echo "$output" | grep -q "SUPPORT_BOT_GITHUB_INSTALLATION_ID is required"
          if echo "$output" | grep -q "MIIEnotarealkey"; then
            echo "the startup error echoed the private key it refused"; exit 1
          fi

      # `cryptography` is the App's only new runtime dependency and the image installs it by hand,
      # so a Dockerfile that drifts from `pyproject.toml` is caught here rather than on the first
      # issue the bot fails to file.
      - name: The image can actually sign a GitHub App assertion
        run: |
          docker run --rm --entrypoint python veaf-support-bot:ci -c \
            "from cryptography.hazmat.primitives.asymmetric import rsa; print('cryptography ok')"

      - name: It starts and answers from outside the container
        run: |
          docker run -d --name support-bot -p 8081:8081 \
            -e SUPPORT_BOT_DRY_RUN=true \
            -e SUPPORT_BOT_HEARTBEAT_SECONDS=2 \
            veaf-support-bot:ci
          alive=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/healthz > /dev/null; then alive=1; break; fi
            sleep 1
          done
          test "$alive" = "1" || { docker logs support-bot; exit 1; }
          curl -s http://127.0.0.1:8081/status | tee status.json
          grep -q '"service": "veaf-support-bot"' status.json
          grep -q '"dry_run": true' status.json

      # A dry run connects no gateway, so it can answer nobody. Liveness still says 200 — the
      # process is alive and restarting it would not open a connection it was told not to open —
      # but readiness must say no, or a probe certifies an empty service. This is the half of that
      # rule only the container can prove: that the distinction survives to the outside.
      - name: A dry run answers liveness but refuses readiness
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/healthz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/readyz)" = "503"
          curl -s http://127.0.0.1:8081/readyz | tee readyz.json
          grep -q '"not_ready_reason": "dry-run"' readyz.json

      # Two things live there now: the quota counters, and the ledger of what `/bug` already
      # filed. A ledger the service cannot write is one report becoming two issues after a restart.
      - name: The quota counters and the filing ledger have somewhere to live
        run: |
          docker exec support-bot sh -c 'test -w /app/state' \
            || { echo "/app/state is not writable by the service user"; exit 1; }
          docker exec support-bot sh -c 'test "$SUPPORT_BOT_GITHUB_LEDGER_FILE" = /app/state/filed-issues.json' \
            || { echo "the filing ledger does not point into the mounted volume"; exit 1; }

      - name: The logs are structured, and the heartbeat beats
        run: |
          sleep 5
          docker logs support-bot > run.log 2>&1
          cat run.log
          grep -q '"event": "service.heartbeat"' run.log
          # A dry run left on in production must never be quiet — and must say, in as many words,
          # that it is serving nobody rather than quietly reporting itself ready.
          grep -q '"event": "service.dry_run"' run.log
          grep -q '"event": "service.dry_run_not_ready"' run.log

      # The HEALTHCHECK is wired and reflects readiness. It reports *unhealthy* here, which is the
      # correct answer for a dry run and is what stops one sitting in production looking fine.
      #
      # That the probe can also say "healthy" is proved in the unit suite, where the same
      # `--healthcheck` code is run against a live health server in both states (`tests/test_cli.py`,
      # TestHealthcheckProbe). A check that can only fail one way proves nothing, so both directions
      # are asserted — just not both here, since a real gateway needs a real token.
      - name: Docker's own health check runs, and calls a dry run unhealthy
        run: |
          state=unknown
          for _ in $(seq 1 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' support-bot)
            [ "$state" = "unhealthy" ] && break
            sleep 2
          done
          test "$state" = "unhealthy" || { echo "health status was '$state'"; docker logs support-bot; exit 1; }

      - name: SIGTERM reaches the process and the shutdown sequence runs
        run: |
          start=$(date +%s)
          docker stop support-bot
          elapsed=$(( $(date +%s) - start ))
          docker logs support-bot > stop.log 2>&1
          tail -n 20 stop.log
          grep -q '"event": "shutdown.requested"' stop.log
          grep -q '"reason": "signal SIGTERM"' stop.log
          grep -q '"event": "service.stopped"' stop.log
          # `docker stop` kills at 10s when the signal is ignored, so a fast exit is the proof.
          test "$elapsed" -lt 8 || { echo "shutdown took ${elapsed}s — SIGTERM did not reach the process"; exit 1; }

      - name: Clean up
        if: always()
        run: docker rm -f support-bot || true
