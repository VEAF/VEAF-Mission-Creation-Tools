title = "VEAF Mission Creation Tools — gitleaks config"

[allowlist]
  description = "Known non-secret patterns"
  paths = [
    # poetry.lock contains SHA256 content-hashes — not credentials
    '''^poetry\.lock$''',
    # Dockerfile contains SHA256 checksums for binary integrity verification
    '''^\.devcontainer/Dockerfile$''',
  ]
  regexes = [
    # DCS slot-password hash (salt:hash) baked into injected aircraft templates to
    # lock throwaway template slots (FIX-TEMPLATE-SLOTS-VISIBLE). Not a credential:
    # it is a fixed, non-reversible DCS Mission Editor hash, not an access secret.
    '''PmJhVFN21Er:LOlEElfvfTfCCEQAkDRvYhpPnZZAzp88mgo_m5Twv0I''',
  ]
