site_name: VEAF Mission Creation Tools
site_description: Tools and Lua scripts for dynamic DCS World missions
site_url: https://veaf.github.io/documentation/
repo_url: https://github.com/VEAF/VEAF-Mission-Creation-Tools
repo_name: VEAF/VEAF-Mission-Creation-Tools
docs_dir: doc
edit_uri: blob/develop/doc/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

# POC: documentation chatbot widget (see poc/doc-chatbot/). Paths are relative to docs_dir (doc/).
extra_css:
  - assets/chatbot/veaf-chatbot.css
extra_javascript:
  - assets/chatbot/veaf-chatbot-config.js
  - assets/chatbot/veaf-chatbot.js

markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      permalink: true
  # Lets headings declare a stable explicit id — `## Title {#stable-anchor}` — so deep
  # links (e.g. from generated mission.yaml comments) survive a heading reword and stay
  # identical across the FR/EN versions of a page (DOC-GUIDE-ANCHORS).
  - attr_list
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - en
        - fr
  - i18n:
      docs_structure: suffix
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Getting help: Obtenir de l'aide
            Diagnostic block format: Format du bloc de diagnostic
            Report block format: Format du bloc de rapport
            When DCS misbehaves: DCS se comporte mal
            Pilot Guide: Guide Pilote
            Overview: Aperçu
            Guide: Guide
            Full Guide: Guide complet
            Mission Maker: Créateur de Mission
            Discover VMCT: Découvrir VMCT
            Tutorial — your first mission: Tutoriel — votre première mission
            Concepts: Les fiches
            The mission folder: Le dossier de mission
            mission.yaml and its modules: mission.yaml et ses modules
            The build: Le build
            Custom scripts: Scripts personnalisés
            Radio presets: Préréglages radio
            Combat zones: Zones de combat
            Dynamic slots: Slots dynamiques
            Spawnable groups: Groupes spawnables
            Weather variants: Variantes météo
            Migration Guide: Guide de Migration
            Scripts: Scripts
            Developer: Développeur
            Capture a map's airbases: Récupérer les aérodromes d'une carte
            References: Références
            CLI Reference: Référence CLI
            Updater & release tools: Mise à jour & publication
            Guided checklists (veafAssist): Checklists guidées (veafAssist)
            Missions menu (veafCombatMission): Menu MISSIONS (veafCombatMission)
            Ground AI (veafGroundAI): IA au sol (veafGroundAI)
            Security & permissions (veafSecurity): Sécurité & permissions (veafSecurity)
            Lua API Reference: Référence de l'API Lua
            Roadmap: Feuille de route
            Testing: Tests
            Aliases: Alias
            mission.yaml Reference: Référence mission.yaml
            Pipeline Reference: Référence Pipeline
        - locale: en
          name: English
          build: true

