schema: spec-driven

# Project context
context: |
  ## Tech Stack
  - **Runtime (DCS)**: Lua 5.1 (pure, no external dependencies), DCS World API
  - **Design-Time Tools**: Python 3.9+, typer, rich, pyyaml, luadata, lupa, Pillow, pydantic
  - **Mission Format**: .miz files (ZIP archives containing Lua dictionaries)
  
  ## Code Conventions
  **Python**: snake_case files, PascalCase classes, UPPER_SNAKE_CASE constants, type hints required, Path objects for files
  **Lua**: veafFeatureName.lua pattern, module-scoped logging, local scope for state, comments in English
  **Documentation**: All code/docs in English, communication in French
  
  ## Architecture Patterns
  - **Worker Pattern**: {tool}_injector/ with *_worker.py (run() entry), *_manager.py (logic), models.py (dataclasses)
  - **Logger Pattern**: from veaf_libs.logger import logger; logger.error(..., raise_exception=True)
  - **Data Flow**: Mission (.miz) → Read/Parse → Python Tool → Write/Serialize → Mission (.miz)
  - **Lua Loading**: veaf.lua (core) → veaf*.lua (features) → dynamic modules
  
  ## Domain Context (DCS World)
  - **Mission (.miz)**: ZIP with Lua tables (mission, options, theatre, warehouses)
  - **Groups**: Collections of units (aircraft, vehicles, ships)
  - **Coalitions**: Blue (NATO) / Red (OPFOR) / Neutral
  - **TACAN**: Tactical Air Navigation beacon
  - **QRA**: Quick Reaction Alert (interceptor defense)
  - **CAS/CAP**: Close Air Support / Combat Air Patrol missions
  - **FARP**: Forward Arming and Refueling Point
  
  ## Important Constraints
  - DCS Lua: Pure Lua 5.1, no external modules at runtime
  - Backward compatibility: Mission files sensitive to breaking changes
  - No silent errors: All errors must be visible to mission makers
  - Windows primary platform (cross-platform consideration)
  
  ## VEAF-Specific
  - Named Points: Predefined locations with ATC services
  - Combat Zones: Dynamic engagement areas
  - Spawnable Groups: Templates for on-demand unit creation
  - Radio Presets: Standardized frequency plans

