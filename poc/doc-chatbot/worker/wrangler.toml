name = "veaf-docs-chatbot"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Wrangler 4 (bumped from 3.90 on 2026-08-08 to close 11 Dependabot alerts, all of them in
# wrangler's own dev-only dependency tree). Nothing in this file had to change: `deploy --dry-run`
# accepts it as-is, the CHAT_KV binding resolves, and the `wrangler kv key put` form the
# docs-chatbot-index workflow calls still exists. Keep `compatibility_date` as it is — moving it
# changes Workers runtime semantics, which is unrelated to the tooling version.

# KV namespace: per-IP rate-limit counters AND the embeddings index (binary vectors + texts).
# The similarity search runs in the Worker, so no paid vector DB is needed. Load the index with:
#   node scripts/build-index.mjs   # writes vec-{lang}.bin + txt-{lang}.json
#   npx wrangler kv key  put --binding CHAT_KV --preview false "idx:vec:fr" --path vec-fr.bin
#   npx wrangler kv key  put --binding CHAT_KV --preview false "idx:vec:en" --path vec-en.bin
#   npx wrangler kv bulk put --binding CHAT_KV --preview false txt-fr.json
#   npx wrangler kv bulk put --binding CHAT_KV --preview false txt-en.json
[[kv_namespaces]]
binding = "CHAT_KV"
id = "9599c6c3af6649b291ed8fdc26545dce"
preview_id = "69f24dd0e20748f29dc235d9b4d90cb6"

# Secret (NOT stored here) — set it with:  npx wrangler secret put GEMINI_API_KEY
# For local `wrangler dev`, put it in .dev.vars (see .dev.vars.example).
