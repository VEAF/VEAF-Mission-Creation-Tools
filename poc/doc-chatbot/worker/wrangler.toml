name = "veaf-docs-chatbot"
main = "src/index.js"
compatibility_date = "2025-01-01"

# KV namespace for per-IP rate-limit counters.
[[kv_namespaces]]
binding = "CHAT_KV"
id = "9599c6c3af6649b291ed8fdc26545dce"
preview_id = "69f24dd0e20748f29dc235d9b4d90cb6"

# Vectorize index holding the doc-passage embeddings (RAG). Create it once with:
#   npx wrangler vectorize create veaf-docs --dimensions=768 --metric=cosine
#   npx wrangler vectorize create-metadata-index veaf-docs --property-name=lang --type=string
# then build + load it:  node scripts/build-index.mjs  &&  npx wrangler vectorize insert veaf-docs --file vectors.ndjson
[[vectorize]]
binding = "VEC"
index_name = "veaf-docs"

# Secret (NOT stored here) — set it with:  npx wrangler secret put GEMINI_API_KEY
# For local `wrangler dev`, put it in .dev.vars (see .dev.vars.example).
