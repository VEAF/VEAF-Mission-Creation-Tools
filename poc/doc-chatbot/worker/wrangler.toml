name = "veaf-docs-chatbot"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Wrangler 4 (bumped from 3.90 on 2026-08-08 to close 11 Dependabot alerts, all of them in
# wrangler's own dev-only dependency tree). Keep `compatibility_date` as it is — moving it changes
# Workers runtime semantics, which is unrelated to the tooling version.
#
# That bump DID break something, found on 2026-09-19: `kv key put` and `kv bulk put` default to the
# **local** Miniflare store in wrangler 4, where wrangler 3 defaulted to remote. The commands below
# kept working, kept printing `Success!`, and stopped uploading anything — the live index froze in
# early August and the assistant answered from it for six weeks. Hence `--remote` everywhere below,
# and a read-back check in the docs-chatbot-index workflow.
#
# The lesson for the next bump: the check recorded here was that the command *still exists*. What
# needed checking was that it still does the same thing.

# KV namespace: per-IP rate-limit counters AND the embeddings index (binary vectors + texts).
# The similarity search runs in the Worker, so no paid vector DB is needed. Load the index with:
#   node scripts/build-index.mjs   # writes vec-{lang}.bin + txt-{lang}.json
#   npx wrangler kv key  put --remote --binding CHAT_KV --preview false "idx:vec:fr" --path vec-fr.bin
#   npx wrangler kv key  put --remote --binding CHAT_KV --preview false "idx:vec:en" --path vec-en.bin
#   npx wrangler kv bulk put --remote --binding CHAT_KV --preview false txt-fr.json
#   npx wrangler kv bulk put --remote --binding CHAT_KV --preview false txt-en.json
# Retrieval similarity floor. Measured 2026-09-19 against the live index, 24 questions per language
# (`scripts/calibrate-floor.mjs`, run by the chatbot-floor-calibration workflow):
#
#            documented           undocumented
#   fr       0.694 – 0.846        0.605 – 0.736     clouds OVERLAP
#   en       0.750 – 0.831        0.578 – 0.724     clouds separate
#
# Two things that measurement settled. First, the shipped default of 0.35 was a **no-op**: nothing
# scored below 0.578, so it never filtered anything. Second, no floor can separate the two in
# French — an undocumented question reaches 0.736 while a documented one drops to 0.694.
#
# So 0.6: comfortably below every documented question measured (0.09 under the French minimum), and
# above the genuinely unrelated tail. It is deliberately modest. Real questions are worded worse
# than the ones in the calibration set and will score lower, and of the two mistakes only one is
# invisible — a floor too high gags a documented question and reads exactly like missing
# documentation. What actually lets the assistant decline is the model judging the excerpts (#966),
# not this number.
[vars]
MIN_SIMILARITY = "0.6"

[[kv_namespaces]]
binding = "CHAT_KV"
id = "9599c6c3af6649b291ed8fdc26545dce"
preview_id = "69f24dd0e20748f29dc235d9b4d90cb6"

# Secret (NOT stored here) — set it with:  npx wrangler secret put GEMINI_API_KEY
# For local `wrangler dev`, put it in .dev.vars (see .dev.vars.example).
