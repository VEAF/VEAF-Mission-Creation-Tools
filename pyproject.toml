[tool.poetry]
name = "veaf-tools"
version = "6.13.94"
description = "A set of tools that help set up and run dynamic DCS World missions"
authors = ["VEAF <https://www.veaf.org>"]
license = "ISC"
readme = "README.md"
homepage = "https://github.com/VEAF/VEAF-Mission-Creation-Tools"
repository = "https://github.com/VEAF/VEAF-Mission-Creation-Tools"
package-mode = true
packages = [
    {include = "veaf_build"},
    {include = "veaf_tools", from = "src/python/veaf-tools"},
    {include = "veaf_mission_mcp", from = "src/python/veaf-tools"},
]

[tool.poetry.dependencies]
python = "^3.11"
rich = ">=13.0,<15"
typer = ">=0.9,<1"
pyyaml = ">=6.0,<7"
Pillow = ">=12.3,<13"
astral = ">=3.0,<4"
pydantic = ">=2.0,<3"
avwx-engine = ">=1.8,<2"
InquirerPy = ">=0.3,<1"
requests = ">=2.28,<3"
mcp = "^2.0.0"
"ruamel.yaml" = ">=0.18,<1.0"

[tool.poetry.scripts]
veaf-build = "veaf_build:main"
veaf-tools = "veaf_tools.app:main"
test-lua = "veaf_build.lua_tests:main"
update-radio-specs = "veaf_build.radio_specs_updater:main"
reindex-docs = "veaf_build.reindex_docs:main"
audit-dcs-mocks = "veaf_build.dcs_mock_audit_cli:main"
check-vendored = "veaf_build.vendored_check_cli:main"
docs-check = "veaf_build.docs_check:main"
docs-stamp-version = "veaf_build.docs_version_stamp:main"
veaf-mission-mcp = "veaf_mission_mcp.server:main"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4"
mypy = ">=1.8"
pytest = ">=8.0"
pytest-cov = ">=5.0"
types-PyYAML = ">=6.0"

[tool.poetry.group.build.dependencies]
# Build tools — not needed for the quality gate, only for creating the .exe
# python = "<3.15": pyinstaller doesn't support Python 3.15+ yet
pyinstaller = { version = ">=6.0", python = "<3.15" }

[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.5,<10"
mike = ">=2.0,<3"
mkdocs-static-i18n = ">=1.0,<2"

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    "src/python/veaf-tools/luadata",
    ".venv",
    "dist",
    "build",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["F401"]   # unused imports OK in test files

# ---------------------------------------------------------------------------
# Mypy — type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src/python/veaf-tools"]
exclude = [
    # Third-party bundled library — not our code
    "luadata",
    # Entry-point scripts (hyphenated names — not importable as modules)
    "veaf-tools\\.py",
    "veaf-tools-updater\\.py",
]
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
# Not strict yet — incrementally tighten after fixing initial violations
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["avwx.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Mypy overrides — existing files with known type errors (technical debt).
# Remove entries as each file is cleaned up.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = [
    # Third-party bundled library
    "luadata",
    "luadata.*",
]
ignore_errors = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["test/python"]
# test/python/testlib holds shared test helpers (not tests). It needs to be importable
# by name: with --import-mode=importlib a test module cannot import a sibling file, and
# a conftest fixture is unreachable from the unittest.TestCase classes that need it.
pythonpath = ["src/python/veaf-tools", "test/python/testlib"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--tb=short",
    "-q",
    "--import-mode=importlib",
    "--cov=src/python/veaf-tools",
    "--cov-report=xml",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=81",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/python/veaf-tools"]
omit = [
    "*/luadata/*",        # third-party bundled library
    "*/test_*.py",
    "*/*_test.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
