channel_lists: # Role-based preset plan (ADR 0010): declare each Radio role's Channel list
  # once per coalition; the build projects it onto every aircraft's physical
  # radios automatically (see doc/PIPELINE_REFERENCE.md, "Radio presets").
  # A channel entry may also carry (ADR 0012): `priority: <n>` to highlight it on
  # every kneeboard (and, on the AJS-37, fill FR22 Special 1/2/3 + FR24 H from
  # priorities 1-4), and `color: <name|#RRGGBBAA>` to group channels visually —
  # e.g. `02: { channel: Archer, priority: 1, color: green }`.
  blue:
    primary_1: # first V/UHF radio
      01:
        title: Guard/UHF
        channel: Guard
      02: Archer
      03: Arctic
      04: Ninja
      05: Pinder
      06: Bengal
      07: Blade
      10: Stennis
      11: Tarawa
      12: Roosevelt
      13: Forrestal
      14: Magic
      17: Texaco-1
      18: Shell-1
      19: Shell-2
      20: Arco-1

    primary_2: # second V/UHF radio; also the warbirds' single radio
      01:
        channel: Guard
        title: Guard/VHF
      02: Batumi
      03: Beslan
      04: Gudauta
      05: Kutaisi
      06: Sochi-Adler
      07: Sukhumi-Babushara
      08: Tbilisi-Lochini
      09: Vaziani

    fm_supplement: # FM atop two V/UHF radios (attack aircraft, e.g. A-10C)
      01: 30
      02: 31
      03: 32
      04: 33
      05: 34
      06: 35
      07: 36
      08: 37
      09: 38
      10: 39
      11: 40
      12: 41
      13: 42
      14: 43
      15: 44
      16: 45
      17: 46
      18: 47
      19: 48
      20: 49
      21: 50
      22: 51
      23: 52
      24: 53
      25: 54
      26: 55
      27: 56
      28: 57
      29: 58
      30: 59

presets_assignments: # manual override: an explicit assignment for a type always wins over
  # the channel_lists projection above (ADR 0010). Kept here only for cases the
  # packer cannot express automatically.
  blue:
    helicopter:
      Mi-8MT: none # no radio injection at all: keep the source mission group's radios untouched
      CH-47Fbl1: modern_blue_fm_uhf # the CH-47's 3rd radio (ARC-201D) reads as VHF to the packer's
      # default band classification, which would add an unwanted 3rd (VHF) radio;
      # this override keeps the intended 2-radio FM/UHF layout.
  red:
    plane:
      all: none
    helicopter:
      all: none

