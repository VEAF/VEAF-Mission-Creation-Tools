# Spawnable aircraft groups (name prefixed with `veafSpawn-`), cloned at runtime
# by veafSpawn. Empty by default — a fresh mission ships no spawnable groups.
# Populate with `veaf-tools extract-aircraft-groups` (or it is produced by
# `convert-v5`) from a mission that actually contains veafSpawn- groups.
airplanes:
  coalitions: {}
helicopters:
  coalitions: {}
