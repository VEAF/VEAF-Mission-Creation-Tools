# ---------------------------------------------------------------------------
# Dynamic-Slot warehouses (DYNSLOT-WAREHOUSE)
# ---------------------------------------------------------------------------
# Configure DCS Dynamic Slots per coalition. The build applies this to the
# mission's `warehouses`: it enables `dynamicSpawn` on the selected airbases,
# sets fuel / munitions / aircraft stock, and links each offered aircraft type
# to its dynamic-spawn template group (the group placed in the Mission Editor
# with "Dynamic spawn template" ticked) via `linkDynTempl`.
#
# This file is OPTIONAL and ships fully commented: as-is it changes nothing.
# A coalition you do NOT declare here is left untouched. This step runs AFTER
# aircraft injection so the template groups (and their ids) already exist.
#
# Example:
#
# blue:
#   defaults:                 # applied to every selected airport
#     fuel: unlimited         # unlimited fuel (omit to leave the mission's value)
#     weapons: unlimited      # unlimited munitions
#     aircrafts:              # aircraft types offered as dynamic slots
#       UH-1H:   { amount: unlimited, template: "DST - UH-1H" }
#       A-10C_2: { amount: 50 }           # template auto-matched by aircraft type
#   airports:                 # OPTIONAL. Absent => ALL blue airports get `defaults`.
#     Senaki-Kolkhi: {}                   # by name (resolved via the mission theatre)
#     24: { aircrafts: { Yak-52: { amount: 10 } } }   # by id + per-airport override
#
# red:
#   defaults:
#     aircrafts:
#       MiG-29S: { amount: unlimited }
#
# Notes:
# - `template` references a template group by NAME; omit it to auto-match a
#   template group of the same aircraft type (same coalition).
# - Airports can be named only on installed theatres whose names are in the
#   committed airdrome table; otherwise reference them by numeric id.
