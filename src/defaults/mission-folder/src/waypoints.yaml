# VEAF Waypoints Configuration Example
# This file defines waypoints and flight plan settings for DCS missions
#
# STRUCTURE:
# 1. waypoints: Define individual waypoints (position, altitude, speed, etc.)
# 2. settings: Define flight plan templates that use those waypoints

# Define individual waypoints
# These are the building blocks that will be assembled into flight plans
waypoints:
  # Example waypoint 1: a holding point (turning point)
  #
  # These coordinates are an EXAMPLE and point at nowhere in particular. Replace them, or delete the
  # waypoint — whatever you leave here is injected into your flight plans at every build.
  #
  # This example used to be called BULLSEYE, and that was a bug rather than a naming choice: a bullseye
  # is not an arbitrary point, it is a property your mission already carries, and every mission built
  # from this template was handed a steerpoint labelled BULLSEYE hundreds of kilometres from the real
  # one — 483 km, measured on the Syria smoke-test mission. INITIAL_POINT and TARGET below are per-mission
  # choices nobody can call wrong; a bullseye has one correct value, so naming an example after it is a
  # claim and not an example.
  HOLDING_POINT:
    type: "Turning Point"
    action: "Turning Point"
    alt: 6096          # 20000 ft in meters
    alt_type: "BARO"
    speed: 999
    speed_type: "TAS"
    x: 75869
    y: 48674
    name: "HOLDING_POINT"
    ETA: 364.89
    ETA_locked: false

  # Example waypoint 2: Initial Point
  INITIAL_POINT:
    type: "Turning Point"
    action: "Turning Point"
    alt: 3048          # 10000 ft
    alt_type: "BARO"
    speed: 50
    speed_type: "TAS"
    x: 70000
    y: 50000
    name: "INITIAL_POINT"

  # Example waypoint 3: Target
  TARGET:
    type: "Turning Point"
    action: "Fly Over Ground"
    alt: 1524          # 5000 ft
    alt_type: "BARO"
    speed: 100
    speed_type: "TAS"
    x: 75000
    y: 48000
    name: "TARGET"

# Define flight plan settings
# These determine which waypoints are injected into which aircraft groups
# Matching criteria (all optional): category, coalition, type, country
# If no criteria are specified, the plan applies to all groups
settings:
  # Flight plan for all blue planes
  all_blue_planes:
    category: "plane"
    coalition: "blue"
    # No type or country specified - applies to all blue planes
    waypoints:
      HOLDING_POINT: "HOLDING_POINT"
      INITIAL_POINT: "INITIAL_POINT"

  # Flight plan for all red helicopters
  all_red_helicopters:
    category: "helicopter"
    coalition: "red"
    waypoints:
      HOLDING_POINT: "HOLDING_POINT"

  # Flight plan for specific aircraft type
  f16_flight_plan:
    category: "plane"
    coalition: "blue"
    type: "F-16C_50"
    # Only F-16C aircraft will receive this plan
    waypoints:
      INITIAL_POINT: "INITIAL_POINT"
      TARGET: "TARGET"
      HOLDING_POINT: "HOLDING_POINT"

  # Flight plan for all aircraft (acts as default)
  default_plan:
    # No category, coalition, or type specified
    # Only used if no other plans match
    waypoints:
      HOLDING_POINT: "HOLDING_POINT"

# USAGE NOTES:
#
# 1. Matching: THE FIRST COMPATIBLE PLAN WINS, in declaration order
#    - A plan matches when every criterion it states matches, and the ones it omits are wildcards.
#    - The FIRST such plan in this file is used. Not the most specific one — declaration order decides.
#    - So put your narrow plans ABOVE your broad ones, or the broad one will swallow them.
#    - Worked example, from this very file: `all_blue_planes` is declared before `f16_flight_plan`, and a
#      blue F-16C matches both, so it gets `all_blue_planes` and `f16_flight_plan` is never used at all.
#      That is dead configuration, left here as the illustration rather than removed.
#    - The code's own docstring claimed a type > category > coalition > all priority until 2026-08-24.
#      It was never implemented; see FIX-WAYPOINTS-PLAN-PRIORITY.
#
# 2. Targeting:
#    - Only human-piloted aircraft groups receive waypoints
#    - Leave a setting with no criteria as a fallback for all units
#
# 3. Coordinates:
#    - X and Y are in mission coordinates (not lat/lon)
#    - Altitude (alt) is in meters
#    - Speed is in m/s
#
# 4. Waypoint Order:
#    - Waypoints are injected in the order they appear in the settings
#    - The first waypoint becomes the initial waypoint
#
# 5. Fields:
#    - type: "Turning Point", "TakeOffGround", "TakeOff", "Landing", etc.
#    - action: Usually same as type
#    - alt_type: "BARO" (barometric) or "RADIO" (AGL)
#    - speed_type: "TAS" (true airspeed) or "IAS" (indicated airspeed)
#    - ETA fields are optional
