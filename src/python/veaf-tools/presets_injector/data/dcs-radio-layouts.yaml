# Radio layout (ADR 0010: per-type radio-preset projection).
#
# Hand-maintained, kept separate from the auto-generated `dcs-radio-specs.yaml`
# (regenerated by `poetry run update-radio-specs` — never hand-edit that file).
#
# Purpose: override the packer's band-based default (`_assign_roles_by_position`
# in presets_manager.py) for aircraft whose physical radio layout needs an
# explicit, VEAF-fixed mapping — either because the default cannot resolve it
# unambiguously, or because the airframe has a quirk (e.g. channel-0 rotation)
# that the default projection alone cannot express.
#
# Schema
# ------
# Top-level keys are DCS unit_type strings, matched exact-first then as a regex
# fullmatch (same resolution order as PresetAssignmentCollection._match_unit_type).
#
# Each entry has a `radios` mapping keyed by **physical radio index, 1-based**,
# matching the order in dcs-radio-specs.yaml / the .miz file. Each radio entry
# has:
#   - `role`: one of the fixed Radio roles (primary_1, primary_2, fm_substitute,
#     fm_supplement, fm_secondary). Mandatory. When `fuse` is also set, `role`
#     still names the radio_type/title the resulting fused radio is given.
#   - primitives (optional), one key per quirk this radio needs. So far:
#       - `rotate_last_to_head: true` — channel-0 rotation. The channel list's
#         last entry is moved to the head of this radio's channel map (DCS
#         channel slot 1, i.e. the aircraft's "channel 0"), then the rest of the
#         list follows in order, wrapping into slots 2..N. Airframe property:
#         applies uniformly regardless of coalition (confirmed against the real
#         Tripack fixture, both blue and red Mi-24P).
#       - `keyed_groups: {block_size: <int>, bases: {<role>: <group>, ...}}` —
#         key-based multi-role mapping (ADR 0012). Several Radio roles share this
#         ONE physical radio; each channel is placed at a DCS slot derived from
#         its declared key (NOT renumbered): for a role with Group base `B` and a
#         channel of key `K`, Group = `B + K` and slot =
#         `((B + K - min_group) mod block_size) + 1` (min_group = lowest base).
#         Preserves key gaps and wraps the block's overflow back to slot 1 (the
#         AJS-37's Group 100 recycles primary_2's 20th channel). A key beyond its
#         role's share of the block (`block_size // number_of_roles`) is dropped
#         with a warning. Replaces the plain single-role lookup for this radio.
#       - `trailing_specials: [{...}, ...]` — a declared, ordered list of special
#         slots appended after the radio's other content, at the trailing slots.
#         Each entry is either an airframe constant `{freq: <float>, mod: <0|1>}`
#         (e.g. the AJS-37's FR24 E/F/G emergency channels) or plan-sourced
#         `{priority: <int>}` — its frequency comes from the preset plan's
#         channel tagged with that priority (ADR 0012; always AM), leaving the
#         slot empty if no such channel exists. An optional `label` names the
#         slot on the kneeboard (e.g. `Sp1`, `H`). With `keyed_groups`, specials
#         start at the fixed block boundary (`block_size + 1`) so they keep their
#         absolute slots even when the data block has gaps. Overridable by the
#         maker via the existing `presets_assignments` bespoke-preset mechanism
#         — that manual-override path is checked before the packer runs at all.
#       - `reserved_head_slots: [<list index>, ...]` — reserved head slot(s).
#         Each entry is a **1-based index into the channel list** that fills one
#         leading DCS channel slot, in the declared order. Only the index that
#         matches the list's actual **last** entry is removed from its original
#         tail position (rotation semantics, same convention as
#         `rotate_last_to_head`); any other reserved index is a leading
#         **duplicate** that also stays in its original tail position. Two
#         shapes seen so far: `[20]` — a single "M" (manual) slot fed by the
#         list's last entry, removed from the tail, so a 20-entry list still
#         produces 20 slots total (OH-58D UHF/VHF) — and `[1, 20]` — a "C" slot
#         duplicating the list's first entry (which stays in the tail too),
#         then an "M" slot fed by its last entry (removed from the tail), so a
#         20-entry list produces 21 slots total (OH-58D FM1/FM2). Mutually
#         exclusive with `rotate_last_to_head` on the
#         same radio (both express "reserve the head of the channel map" —
#         declaring both on one radio is rejected by the parser as an authoring
#         error).
#       - `capacity: <int>` — slot capacity. The maximum number of channel
#         slots this radio physically holds. When the radio's final composed
#         channel count (after every other primitive above has run) exceeds
#         `capacity`, the excess is truncated from the END of the list (e.g.
#         Tripack itself truncated the AJS-37's VHF list to fit its 47-slot
#         radio). Truncation is silent by design: a debug-level log line
#         records it, no build-time warning noise (exploration doc §8.4:
#         `validate` is the verbose path for this). Omit when the radio's
#         capacity is not a practical concern (e.g. AJS-37: 47 slots exactly
#         filled by design, never exceeded — no entry needed).
#
#     Composition order when several primitives are declared on the same radio
#     (ADR 0010/0012): the base content comes from either `keyed_groups` (its
#     own key-based placement) or the plain role list; for the plain-list path,
#     channel-0 rotation OR reserved head slot(s) (mutually exclusive with each
#     other — see above) then apply; then trailing specials are appended (at the
#     block boundary for `keyed_groups`, else right after the content); then slot
#     capacity truncates the result if it exceeds the declared limit.
#
# A comment above each radio index should identify the real DCS radio it is
# (name + band), for readability against dcs-radio-specs.yaml.
#
# The packer cross-checks `radios`' declared indices against
# `get_radios(unit_type)`'s actual radio count and logs a WARNING if they
# disagree (e.g. a DCS patch changed the aircraft's radio count) — see
# `_check_layout_radio_count` in presets_manager.py.
#
# A type with no entry here falls back to the band-based default
# (`_assign_roles_by_position`); this file only needs entries for aircraft that
# require an explicit override or a primitive. Notably, A-10C and A-10C_2 are
# deliberately absent: their VHF-first radio ordering and (for A-10C_2) the
# ARC-210's wide-band ambiguity are BOTH already resolved correctly by the
# default projection (verified end-to-end in
# test_radio_preset_packer.py::TestPackPresetRealSpecsEndToEnd and
# test_channel_lists.py::TestShippedDefaultMigration) — no entry needed here.

Mi-24P:
  radios:
    # radio 1: R-863, V/UHF combo. Role assignment already resolves correctly
    # by band under the default (classified "ambiguous" -> primary_1); listed
    # here mainly for explicitness/robustness (ADR 0010's "VEAF-fixed" slot ->
    # role mapping), the primitive below is this entry's real payload.
    1:
      role: primary_1
      rotate_last_to_head: true
    # radio 2: R-828, plain FM radio, no rotation.
    2:
      role: fm_substitute

AJS37:
  radios:
    # radio 1: the Viggen's single V/UHF set (103-400 MHz), stored by DCS as one
    # 47-slot Radio table (ADR 0012). The 40 data channels use the pilot
    # convention "channel N = Group 10N": primary_1 keys 1..20 -> Groups 101-120
    # (DCS slots 2-21), primary_2 keys 1..19 -> Groups 121-139 (slots 22-40), and
    # primary_2 key 20 -> Group 100 (slot 1), recycling the otherwise-unused first
    # slot (`keyed_groups` block_size 40, bases primary_1=100 / primary_2=120).
    # Then 7 trailing specials at absolute slots 41-47: FR22 Special 1/2/3 and
    # FR24 H are plan-sourced (priorities 1-4, always AM); FR24 E/F/G are fixed
    # airframe emergency constants. Breaks ADR 0003 iso-functionality on purpose
    # (slot 1 is now primary_2[20], not a dummy).
    1:
      role: primary_1
      keyed_groups:
        block_size: 40
        bases:
          primary_1: 100
          primary_2: 120
      trailing_specials:
        - { priority: 1, label: Sp1 } # FR22 Special 1 <- plan priority 1
        - { priority: 2, label: Sp2 } # FR22 Special 2 <- plan priority 2
        - { priority: 3, label: Sp3 } # FR22 Special 3 <- plan priority 3
        - { freq: 33, mod: 1, label: E } # FR24 E (fixed emergency channel)
        - { freq: 34, mod: 1, label: F } # FR24 F (fixed)
        - { freq: 127.5, mod: 0, label: G } # FR24 G (fixed)
        - { priority: 4, label: H } # FR24 H (LARM/GUARD) <- plan priority 4

CH-47Fbl1:
  radios:
    # radio 1: "VHF FM: ARC-186". Real role is FM (Tripack fixture rotates it
    # like the Mi-24P), but its ranges include a secondary 108-152 MHz AM band
    # alongside its primary 30-88 MHz FM band, which makes the band-only
    # default classifier (_classify_radio) see it as "vhf"-capable and assign
    # it primary_2 instead — an explicit entry is required to fix this.
    1:
      role: fm_substitute
      rotate_last_to_head: true
    # radio 2: "UHF AM: ARC-164", 225-400 MHz, unambiguously UHF. Also rotates
    # (Tripack fixture's radio 2 = RADIO1_20 at slot 1, same channel-0 pattern
    # as radio 1 and as the Mi-24P).
    2:
      role: primary_1
      rotate_last_to_head: true
    # radio 3: "VHF FM: ARC-201D", a clean second 30-88 MHz FM set. Declared so
    # the radio-count guard matches the specs' real 3-radio count; gets no
    # content unless the maker declares a distinct fm_secondary list (defaults
    # to fm_supplement — see _channel_list_for_role — which the shipped
    # default does not declare for this role, matching the legacy Tripack
    # preset's 2-radio-only FM+UHF layout).
    3:
      role: fm_secondary

OH58D:
  radios:
    # radio 1: UHF AM. Reserved "M" (manual) head slot fed by the list's last
    # entry (#20); slots [2..20] hold entries #1..#19.
    1:
      role: primary_1
      reserved_head_slots: [20]
    # radio 2: VHF AM. Same "M" pattern as radio 1.
    2:
      role: primary_2
      reserved_head_slots: [20]
    # radio 3: VHF FM1. Reserved "C" head slot fed by entry #01, then "M" fed
    # by entry #20; slots [3..21] hold entries #1..#19.
    3:
      role: fm_supplement
      reserved_head_slots: [1, 20]
    # radio 4: VHF FM2. Same "C"+"M" pattern as radio 3; content defaults to
    # fm_supplement's list when the maker does not declare fm_secondary
    # (see _channel_list_for_role in presets_manager.py).
    4:
      role: fm_secondary
      reserved_head_slots: [1, 20]
