# DCS aircraft radio frequency specifications
# Generated from https://github.com/Quaggles/dcs-lua-datamine
# Source ref: d75d7ac540ab5683b07d6a7c0f59b48528e8ff1a
# Re-run `veaf-build update-dcs-data --radio` to update after a pin bump.
#
# Structure:
#   <dcs_unit_type_id>:
#     name: Human-readable aircraft name
#     category: plane | helicopter
#     radios:
#       - name: Radio name as shown in DCS
#         ranges:
#           - min_mhz: 30.0
#             max_mhz: 87.975
#             modulation: FM | AM | AM/FM
#     human_radio:            # range the ME accepts as the group's PRIMARY frequency
#       min_mhz: 38.4         # narrower than `radios` for some airframes (FW-190: 38.4-42.4
#       max_mhz: 42.4         # vs a 38-156 preset range) — a primary outside it is rejected
#       default_mhz: 38.4     # DCS's own default, or null
#       modulation: FM | AM | AM/FM
#     dcs_rejects_on_load: true   # from dcs-radio-specs-overrides.yaml
#
# VEAF corrections live in dcs-radio-specs-overrides.yaml and are merged in here by
# the generator, so they survive a pin bump. Never edit THIS file by hand.

