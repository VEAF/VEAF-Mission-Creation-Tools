# F-16C engine start — the "Before Starting Engine" / "Starting Engine" slice of ED's own
# autostart sequence (Mods/aircraft/F-16C/Cockpit/Scripts/Macro_sequencies.lua,
# start_sequence_full), in ED's order and with ED's wording.
#
# EVERY step is pilot-confirmed, and that is not a shortcut. A cockpit control's position
# cannot be read from the mission environment — measured in game on 2026-08-01, with MAIN
# PWR moved through all three positions while the animation argument never budged. See
# docs/exploration/DCS-COCKPIT-ASSISTANCE-API.md section 3.
#
# What IS readable is the effect a control produces (altitude, speed, gear, fuel…), via a
# step's `param:`. Nothing in an engine start qualifies: the aircraft publishes no switch
# state, and its engine RPM only becomes meaningful once the engine already runs — which
# is the last step anyway. So the assistance here boxes the control, shows the checklist,
# and lets the pilot tick.
#
# Element names are read from clickabledata.lua. The JFS switch is spring-loaded
# (springloaded_3_pos_tumb), so even in an environment that could read arguments, it would
# be back at 0 before anything polled it.

id: f16c-cold-start
title: assist.f16c.coldstart.title
aircraft: [F-16C_50]
menu: cold-start

steps:
  - label: assist.f16c.main_pwr_batt
    element: PTR-ELEC-TMB-MPWR-510
    confirm: true

  - label: assist.f16c.main_pwr_on
    element: PTR-ELEC-TMB-MPWR-510
    confirm: true

  - label: assist.f16c.jfs_start2
    element: PTR-ENGSTART-TMB-JETFUEL-447
    confirm: true

  - label: assist.f16c.jfs_run_light
    element: PTR-ENGSTART-TMB-JETFUEL-447
    confirm: true

  - label: assist.f16c.throttle_idle
    element: PTR-THRTL-RLS-757
    confirm: true

  - label: assist.f16c.engine_idle
    confirm: true
