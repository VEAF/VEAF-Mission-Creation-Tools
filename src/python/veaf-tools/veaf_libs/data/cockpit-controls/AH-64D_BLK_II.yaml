# Clickable cockpit controls of the AH-64D_BLK_II.
# Generated from AH-64D/Cockpit/Scripts/clickabledata.lua in a DCS install.
# `positions` is in HINT order, which is not value order: a switch whose hint
# reads MAIN PWR/BATT/OFF runs +1/0/-1. Never infer a value from a rank here.
# `readable` is false for buttons and spring-loaded switches: they have no
# position to poll, so a step on one has to be pilot-confirmed.
# Install-dependent, so NOT CI-guarded. Re-run
# `veaf-build update-dcs-data --cockpit-controls --dcs-path <DCS>` after a DCS update.

