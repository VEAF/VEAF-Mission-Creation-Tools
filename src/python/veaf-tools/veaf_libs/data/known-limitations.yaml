# Known limitations — what an agent or a mission maker must know before building a mission.
#
# ONE source, read by the MCP action `describe_known_limitations` (shipped in the executable) and
# rendered into docs/agents/dcs-runtime-traps.md for readers of the repository. Never copy an entry
# by hand anywhere else: point to the action, or regenerate the page
# (`poetry run python -m veaf_libs.known_limitations`).
#
# Two kinds of entry:
#   tool  a limitation of veaf-tools / the MCP. Fixed one day: set `fixed_in` to the release that
#         fixes it and the action stops returning it from that version on.
#   dcs   a behaviour of DCS World that raises no error and is wrong anyway. Never "fixed": always
#         returned. Record the measurement — the value, the date, what it broke — not a conclusion.
#
# Lot rule (CLAUDE.md §9): a lot that finds a limitation without fixing it adds it here; a lot that
# fixes one sets its `fixed_in`; a surprising DCS behaviour, measured, goes here too.
#
# Fields: id (unique, kebab-case), kind (tool|dcs), area, title, symptom, workaround, cost (what it
# broke; optional), measured (YYYY-MM-DD, required for dcs), fixed_in (tool only, optional).
# `area` groups the entries: spawning, air-defence, players, radio, ground-ai (dcs); mcp, pipeline, runtime (tool).
# symptom / workaround / cost are Markdown.

limitations:
- id: disposition-getsimplezones-is-a-lottery
  kind: dcs
  area: spawning
  title: "`Disposition.getSimpleZones` counts vehicles as obstacles, honours neither its radius nor its clearance, and is not deterministic"
  measured: "2026-09-26"
  symptom: |
    The undocumented `Disposition` singleton is the only DCS API that knows where the forests are,
    so it is what every scenery-aware placement in this codebase rests on. **It proposes points; it
    does not answer questions**, and three of its four parameters mean less than they look.

    Measured on GermanyCW-v6, `getSimpleZones(point, searchRadius, posRadius, attempts)`:

    | Asked | What comes back |
    |---|---|
    | `searchRadius = 1000` | candidates at up to **2769 m** |
    | `posRadius = 183` (clearance) | a candidate **blocked in 12 directions out of 12 at 10 m** |
    | the same call, five times in a row | nearest candidate at **1335, 1476, 1404, 1355, 1293 m** — and a sixth found one at **153 m** |

    The last line is the one that hurts: the scatter is not noise around a value, it is the
    difference between "there is a clearing 150 m away" and "there is nothing within a kilometre".

    The *small* query — "is there a patch of 5 m free within 20 m of this point?" — **is** reliable
    and repeatable: 12 repetitions on the same points gave 0/12 against 12/12, with identical
    candidate counts. So the singleton is dependable as a probe and unreliable as an oracle.

    **But it counts VEHICLES, not just scenery — and that has invalidated more measurements here
    than anything else on this page.** It answers "is there room free here", and a tank occupies
    room. Measured in game on 2026-09-26 (GermanyCW-v6), the same points probed twice, seconds
    apart, the only difference being whether the group was standing on them:

    | group | with its vehicles | group destroyed |
    |---|---|---|
    | `combatZone_Brocken` EWR, 3 vehicles | **3 / 3 blocked** | **0 / 3** |
    | `combatZone_Borkenberge_Hard` S-300, 14 vehicles | **12 / 14 blocked** | **0 / 14** |

    Fifteen of seventeen vehicles reported as "standing in trees" were standing in nothing but each
    other. A tight SAM battery cannot pass this test wherever you put it, so **any count of "units
    in scenery" taken after a spawn is largely a count of groups blocking themselves**. Three such
    figures — 81, then 76, then 69 — were published before this was found.

    It also explains, and disposes of, a "blindness" reported earlier the same day: probed from
    inside `veafUnits.settleGroup` witness points answered "clear" and answered "blocked" one second
    later. `settleGroup` runs **before the units exist**; the control ran after they had spawned.
    Two different questions, not a singleton that lies.

    **So probe where no vehicle of the group exists yet** — which is where `settleGroup` probes
    anyway. Measured there, vehicles genuinely under trees on arrival were **22**, not 76, and
    **4** after `settleGroup` had done its work.
    **The clearance you ask for decides whether it answers at all.** Same point, varying nothing but
    `posRadius`:

    | asked | 5 | 10 | 20 | 40 | 80 | 120 | 200 | 300 |
    |---|---|---|---|---|---|---|---|---|
    | candidates over 3 draws | 30 | 30 | 30 | 30 | 30 | 30 | 21 | **0** |

    Ask for a group's own footprint — 58 to 486 m on real groups — and it returns nothing, every
    time. This is what made `veafUnits.settleGroup` inert: 31 calls in one activation of 25 combat
    zones, **one** group translated, 30 giving up with no candidate to examine.

    Some places are out of reach entirely: for them it returns **zero at every clearance, down to
    5 m**, and no parameter will help.

    A blindness inside the spawn's own call stack was reported on 2026-09-26 and **did not survive
    remeasurement** the same evening: the same witness points answer the truth from inside
    `settleGroup`, before and after its large draws, with 25 zones firing at once. Over 20 groups,
    17 get candidates in flight, and replaying the identical queries from a quiet frame recovers
    none.
  workaround: |
    **Use the small query as a probe, and never use the large one to find a clearing.** To find
    open ground, sweep the neighbourhood yourself — offsets on rings of growing radius, closest
    first — and ask the small query about each point you would use. It is 0.38 ms a call against
    12 ms for the large one, and it gives the same answer every time. This is what
    `veafUnits.settleGroup` does since FIX-PLACEMENT-IGNORES-SCENERY ticket 12, and what
    `veafGrass.findClearBearing` asks about a FARP escort's wanted spot since
    FIX-PLACEMENT-MOVES-ON-CLEAR-GROUND ticket 03 — reading that spot off the nearest large-query
    candidate never worked: the nearest one measured in game was 43.9 m away.

    If you do use the large query, treat what it returns as *suggestions*: verify every point with
    the small query, draw several times and merge, ask for little clearance (21 candidates at 200 m,
    none at 300 m), and never let the radius or the clearance you asked for stand in for a
    measurement.

    Moving the query out of the spawn flow is **not** required, and was measured to buy nothing.
    Deferring the spawn itself is a trap in its own right — the group name a spawn returns feeds
    `veafSkynet.declareSpawn`, convoy routing and `veaf.readyForCombat`, so delaying creation
    silently empties all three.
  cost: |
    Three rounds on the same defect, two of them shipped green and inert. Ticket 08 of
    FIX-PLACEMENT-IGNORES-SCENERY assumed the **radius** was honoured, so its acceptance test could
    never pass and it displaced nothing, ever. Ticket 10 assumed the **clearance** was honoured and
    wrote it into a comment — "a candidate is scenery-free by construction" — and translated groups
    into the middle of woods; released in 6.25.0, measured inert the same day.

- id: scenery-probe-grid-steps-over-copses
  kind: dcs
  area: spawning
  title: "A grid of scenery probes 50 m apart steps over a copse; 25 m apart it does not"
  measured: "2026-09-28"
  symptom: |
    The small `Disposition.getSimpleZones` probe answers "blocked" only where its whole 20 m disc is
    covered, so a wood smaller than the gap between two probes can sit between them unseen. Measured
    on Caucasus, on an empty mission, 12 points compared with rings probed every 20 m:

    | probe spacing | worst error on the clear radius |
    |---|---|
    | 25 m | −20 / +10 m |
    | 50 m | **+130 m** — 170 m promised where a copse stood 60 m away |
    | 200 m | **+200 m**, several points |

    Costs, same session: **0.15 to 0.17 ms** a probe on an empty Caucasus mission, **190 ms** a call
    across `dcs-serve` whatever it carries. On GermanyCW the same sweep ran at about **0.3 ms** a
    probe (1.45 M cells in 8 min), in line with the 0.38 ms measured there on 2026-09-26.
  workaround: |
    Sweep at 25 m where groups are placed, and never read a clear radius off a coarser grid. Batch
    thousands of probes per call: the call, not the probe, is what costs.
  cost: |
    The whole-map 200 m pass FEAT-CLEAR-GROUND-AT-AUTHORING first planned would have promised
    clearings in woods; ticket 01 measured it before it was built.

- id: arrow-at-sea-level-slides-on-the-f10-map
  kind: dcs
  area: players
  title: "An `arrowToAll` drawn at y = 0 slides away from the ground as the F10 map is panned"
  measured: "2026-10-08"
  symptom: |
    Observed by David on *Kolkhida* mission 1 (Caucasus, Colchis plain, terrain 0–50 m): the campaign's
    assault-convoy arrows, both ends at `y = 0`, were right only fully zoomed in. Panned, even zoomed,
    they shifted "as if on another plane": both started from one point east of Poti, about 25 %
    longer than the axes they drew. The zone circles (`circleToAll`, also at `y = 0`), their labels
    and DCS's own route lines held still.
  workaround: |
    Give every point of a drawn shape the terrain height, `land.getHeight({ x = p.x, y = p.z })`, as
    the points of the shapes drawn from map markers already are. That this is the whole answer is
    **not confirmed** yet: the circles at `y = 0` do not slide.

- id: lua-chunk-over-200-locals-is-refused
  kind: dcs
  area: scripting
  title: "A Lua file with more than 200 top-level locals is refused whole"
  measured: "2026-10-08"
  symptom: |
    DCS runs Lua 5.1, which accepts at most 200 active `local` variables in one function — and a
    script file's top level is one function. Past that, the file does not load at all:
    `Mission script error: [string "l10n/DEFAULT/veaf-scripts.lua"]:81100: main function has more
    than 200 local variables`. Nothing in the file runs, and every later script that uses it fails
    in turn (`attempt to index global 'veaf' (a nil value)`).

    Measured on the VEAF bundle, which concatenates every module into one file: 190 top-level
    `local` lines loaded on 2026-10-07, 198 lines (202 names) failed on 2026-10-08, after the
    campaign, opposition and convoy modules were added. Every module loaded alone was fine.
  workaround: |
    Wrap each part of a long script in its own `do ... end` block: its locals die at its `end`, and
    the limit applies per block. The VEAF build does it for every module since
    FIX-BUNDLE-LOCAL-LIMIT. In a hand-written `mission-script.lua`, keep state in a table
    (`myMission = {}`) rather than in hundreds of top-level locals.
  cost: |
    *Kolkhida* mission 1, rebuilt from `develop` the afternoon it was to be flown, loaded no VEAF
    module; no test had ever run the concatenated bundle.

- id: assault-convoy-garrison-keeps-its-convoy-behaviour
  kind: tool
  area: runtime
  title: "An assault convoy that took a zone is its garrison, and still a convoy"
  symptom: |
    When a campaign's assault convoy captures a neutral zone, its survivors become the zone's
    garrison where they stand, but `veafGroundAI` still drives them as a convoy under fire: at the
    next contact they may split and fall back, leaving the zone they are recorded as garrisoning.
    The next mission spawns them back in the zone, at the positions recorded at the capture.
  workaround: |
    None in flight; an escorted convoy rarely meets a second contact after taking its zone.

- id: clear-ground-covers-what-was-swept
  kind: tool
  area: mcp
  title: "Clear-ground placement only covers what was swept, and not runtime-assembled groups"
  symptom: |
    `add_group` puts a stationary vehicle group on ground measured clear only where a clear-ground
    catalogue covers the place: shipped are Caucasus (6 km around each of its 21 airfields) and
    GermanyCW (6 km around the 25 combat zones of GermanyCW-v6). Elsewhere the group stays where it
    was asked to go, with a warning. A combat-zone marker whose group is assembled from dice rolls
    at runtime (`-armor`, `-infantry`, `-combat`, `-transport`, `-convoy`) has no size known in
    advance and is never moved; the runtime's `settleGroup` moves it off scenery when it spawns.
  workaround: |
    Sweep the place first — `veaf-tools dcs clear-ground-sweep <theatre> --zones-from <mission>`
    (about ten seconds a combat zone on Caucasus) — and check a built mission with
    `veaf-tools dcs clear-ground-check`.

- id: late-activated-group-is-visible
  kind: dcs
  area: spawning
  title: A late-activated group is fully visible to the scripting API before it is activated
  measured: "2026-09-21"
  symptom: |
    On a group whose activation was still thirty seconds away:

    | Asked | Answer |
    |---|---|
    | `coalition.getGroups(side, category)` | **returns it** |
    | `Group:isExist()` | **true** |
    | `Unit:isExist()` | **true** |
    | `Unit:inAir()` | **true** |
    | `Unit:isActive()` | **false** — the only one that tells the truth |

    `lateActivation = true` hides a group from the map and from nothing else.
  workaround: |
    When sweeping for real units, test `Unit:isActive()`. `veaf.isUnitAlive(unit)` already does it
    (`unit:isExist() and unit:isActive()`) and is the right thing to call.
  cost: |
    The one shipped product bug on this list: `veafSkynet.listHostileAircraft` reported a parked,
    unactivated intruder as an airborne contact, so the spotter network woke real SAM sites for an
    aircraft that did not exist — in every mission using late activation.

- id: start-time-does-not-delay-an-air-spawn
  kind: dcs
  area: spawning
  title: "`start_time` on an aircraft group does not delay its spawn"
  measured: "2026-09-21"
  symptom: |
    A group with `start_time = 90` in the mission table was **airborne at t = 9 s**. Late activation
    is no substitute: the group stops being drawn, never stops being seen (entry above).
  workaround: |
    The only real delay is not putting the group in the mission at all, and building it with
    `coalition.addGroup` from a scheduled function.
  cost: Two failed attempts in a row at the same requirement.

- id: mission-clock-is-theatre-local
  kind: dcs
  area: spawning
  title: The mission's `start_time` is on the theatre's clock, with a fixed offset
  measured: "2026-09-24"
  symptom: |
    Caucasus 2022-06-29 at 01:28 is pitch dark (sunrise 01:43 UTC there), so not UTC. GermanyCW,
    Ramstein 1980-06-01 at 04:58 is dawn with the sun not up: UTC+2 (sunrise 03:28 UTC; +1 would
    have put the sun 30 min up). One fixed offset per map — `veafTime.getTimezone()` in game,
    `weather_injector/utils/theatre_offsets.py` at build. Not the IANA zone: DCS models no daylight
    saving time. GermanyCW was measured in June only; whether DCS keeps +2 in winter is not known.
  workaround: |
    Write a mission start time in the theatre's local time; the `sunrise…` / `sunset…` weather
    variants already do (since FIX-SCRATCH-MISSION-FINDINGS 02).
  cost: |
    Every solar-time weather variant of every v6 mission started 2 to 4 hours early until 02 fixed it.

- id: sam-without-ewr-is-lit
  kind: dcs
  area: air-defence
  title: A SAM site with no early-warning radar is not dark — it is permanently lit
  measured: "2026-09-21"
  symptom: |
    A Skynet SAM site is autonomous exactly when no valid parent radar covers it, and autonomous
    means `AUTONOMOUS_STATE_DCS_AI`: removing every EWR hands **all** sites to the DCS AI, which
    lights everything up, all the time.
  workaround: Give a network that must stay dark an EWR covering its sites.
  cost: A test rig built around "no EWR, so only the relay wakes them" delivered every battery lit.

- id: only-two-ewr-types
  kind: dcs
  area: air-defence
  title: Only two unit types carry the `EWR` attribute
  measured: "2026-09-21"
  symptom: |
    `55G6 EWR` and `1L13 EWR`, nothing else. There is no short-range early-warning radar, so an EWR
    parenting a battery also sees everything the battery would.
  workaround: Plan the network around those two types.

- id: awacs-contact-radar-flag-comes-and-goes
  kind: dcs
  area: air-defence
  title: An AWACS can hold a contact for minutes flagged `DLINK` only, which Skynet does not read
  measured: "2026-10-05"
  symptom: |
    `Controller:getDetectedTargets(Controller.Detection.RADAR)` on an AI A-50 leaves out contacts the
    same call without a filter returns. A blue KC-135 82 km from the A-50, at 24 000 ft, was in its
    list from t = 6 s but flagged `DLINK` only in every reading up to t = 239 s, and `RADAR` at
    t = 269 s — while a C-130 and a second KC-135 spawned next to it, and an E-3A spawned 60 km from
    the A-50, were flagged `RADAR` within a minute. Skynet asks for `RADAR` only, so for those minutes the AWACS fed the IADS
    nothing about that aircraft. The A-50's radar range, as `getSensors` declares it, is 204 462 m
    (55G6: 267 496 m), and Skynet reads it correctly.
  workaround: |
    Do not read one sample of a contact's detection flag as a property of the radar: read it over
    several minutes. Do not count on an AWACS to report a given aircraft to Skynet the moment it
    holds it: the same contact can stay invisible to the IADS for minutes.
  cost: |
    Read at t = 6 and t = 78 alone, it looked like "an AWACS only reports datalink contacts", and
    was announced as the cause of three blind A-50s (INVESTIGATE-SKYNET-AWACS-BLIND) before a later
    reading refuted it.

- id: battery-wakes-in-its-own-envelope
  kind: dcs
  area: air-defence
  title: A battery lights up only when the contact is in *its own* envelope
  measured: "2026-09-21"
  symptom: |
    Three Kub sites 15 km apart woke in the *same second*: a Kub engages out to ~24 km and the
    intruder entered all three envelopes at once.
  workaround: |
    To stagger wake-ups along a line, space batteries further apart than they can shoot. With the
    spotter radio range at 20 km, that only fits a short-range SAM — Osas (~10 km) 15 km apart wake
    one at a time.

- id: fast-level-aircraft-is-a-harm
  kind: dcs
  area: air-defence
  title: A fast, level aircraft is classified as a HARM — and that is deliberate
  measured: "2026-09-21"
  symptom: |
    An F-15C on a straight, level run at **804.88 kt** was identified by Skynet as an anti-radiation
    missile, and the SAM sites went into evasion and shut down. Skynet's test is `groundSpeed > 800
    kt` **and** at most two flight-path changes (`documentation/tactics.md`), identification being
    probabilistic on top.
  workaround: |
    An aircraft meant to be seen and engaged must stay **below 800 kt** and have a **change of
    altitude** on its route — one dip is enough. DCS lets an aircraft fly well past its waypoint
    speed (the run above was set to ≈390 kt), so the altitude profile is the reliable half.
  cost: The demonstration the SAM sites were there to give was silently defeated.

- id: air-defence-spotters-are-blind
  kind: dcs
  area: air-defence
  title: Half the obvious "forward observers" are blind
  measured: "2026-09-21"
  symptom: |
    `veafSkynet.SpotterUnitTable` is walked in order and the first matching row wins; `SAM elements`
    (range 0) comes before `MANPADS` (10 km):

    | Unit | First row it matches | Sight |
    |---|---|---|
    | `SA-18 Igla-S manpad` | `MANPADS` | 10 000 m |
    | `ZSU-23-4 Shilka`, `Roland ADS` | `SAM elements` | **0 — blind** |
    | `Kub 1S91 str`, `Osa 9A33 ln` | `SAM elements` | **0 — blind** |
    | `Ural-375` | `Unarmed vehicles` | 3 000 m |

    The zero is VEAF's, and deliberate: DCS does give the Shilka and the Osa optics, but `SAM elements`
    are covered by Skynet's last line of defence, and a second competing radius would make one of the
    two settings dead weight (`veafSkynetIadsHelper.lua`, above `SpotterUnitTable`).
  workaround: Use manpads or ordinary vehicles as spotters, not air-defence vehicles.

- id: game-master-marks-are-coalition-scoped
  kind: dcs
  area: players
  title: A game master **is** coalition-scoped for map marks
  measured: "2026-09-21"
  symptom: |
    With one `markToAll` and one `markToCoalition(RED)` marker side by side, a **blue** game master
    sees the `markToAll` marker only, a **red** one sees both. A game master has no group (so no
    `USAGE_ForGroup` radio command reaches him) but he does have a coalition.
  workaround: Watch a red network from a red game-master slot.
  cost: A false bug report against working code, and very nearly a "fix" to a correct drawing path.

- id: static-without-shape-name-is-refused
  kind: dcs
  area: spawning
  title: Some static types placed without a `shape_name` are refused at mission load, and the object never exists
  measured: "2026-09-28"
  symptom: |
    `dcs.log` at load: `ERROR APP (Main): unknown static shape_name, category Fortification, type:
    .Command Center` (and `category Warehouse, type: .Ammunition depot`). DCS does not create the
    object, and nothing in the mission file, the build or a scripting call says so afterwards.
    Many other types spawn without the field (Warehouse, Bunker, Barracks 2, Fuel tank, Tank, aircraft
    statics): DCS resolves the shape itself for most types, not all.
  workaround: |
    Write the `shape_name` the Mission Editor writes — the unit database carries it for every static
    (`dcsUnits.yaml`, from the datamine's `ShapeName`). `add_group` writes it, and `validate` reports a
    static that lacks it.
  cost: 4 objectives of GermanyCW-v6, placed by the MCP before it wrote the field, missing in game; a
    combat zone drew 4 elements from 3.

- id: no-parking-data-outside-three-theatres
  kind: tool
  area: mcp
  title: No ramp or runway start through the MCP outside Caucasus, Persian Gulf and Syria
  symptom: |
    `add_air_group` with a `parking-*` or `runway` start is refused with *"no parking data captured
    for theatre …"* on every other map (GermanyCW, Nevada, Normandy, Sinai…): only those three
    theatres ship a parking capture in `veaf_libs/data/parking/`.
  workaround: |
    Use an air start there, or place the flight in the DCS Mission Editor. The capture itself is a
    session in DCS: `veaf-tools dcs capture-map --parking`.

- id: ctld-jtac-imposed-code-and-radio
  kind: tool
  area: runtime
  title: "A JTAC's imposed laser code can be handed to another JTAC, and its ASSETS frequency is not the one CTLD announces"
  symptom: |
    Measured on the Syria Open Training v6, 2026-10-02: `modules.ASSETS` declares Reaper 1 with
    `jtac: 1688`, `freq: 36.0`, `mod: FM`; CTLD registered **two** JTACs on 1688 — the Reaper and the
    shipped catalogue's `veafSpawn-MQ9 - AFAC - JTAC - DRONE`, which CTLD picks up at its start by its
    name, before `veafAssets` sets its codes. CTLD (2.0.0-rc11, still so on `VEAF/CTLD` develop) never
    removes an imposed code from the pool its automatic codes come from, and hands out the highest
    first. Its JTAC also always derives its radio from the laser code (Reaper 1 announced on about
    40.4 FM, not 36.0), and none at all for a code above `jtacLaserCodeMax`.
  workaround: |
    Keep the ASSETS codes below `jtacLaserCodeMax` and lower that maximum so the automatic codes stay
    under it (the Syria mission: `jtacLaserCodeMax` 1686, Reapers on 1511 / 1512); announce the
    frequency CTLD computes for the code (35.55 / 35.6 FM there), not another.
  cost: |
    Two JTACs lasing on one code, and a briefing announcing a frequency on which no JTAC answers.

- id: airfield-logistics-is-one-250m-zone
  kind: tool
  area: runtime
  title: An airfield's CTLD logistics covers 250 m around one parking stand, not the whole field
  symptom: |
    With `modules.CTLD.manage_airbase_logistics` on, each airfield gets **one** logistic zone of
    `airbase_logistics_radius` (250 m by default), centred on the parking stand nearest the centroid
    of all its stands. On a widely spread airfield, an aircraft parked farther than that from the
    chosen stand reads *"No logistics in range"* although the field is active and its green circle is
    on the F10 map. An airfield whose `Airbase:getParking()` returns nothing gets no zone at all.
    Measured on 2026-10-03 at **Ramstein** (GermanyCW): a C-130 left to DCS's own choice of stand
    parked **997 m** from the zone's centre, and only **one** of the field's 90 large-aircraft stands
    lies within 250 m (the next ones at 446, 601, 665, 709 and 820 m). 250 m fits a small field or a
    FARP-sized apron; it does not fit a major air base.
  workaround: |
    Size `modules.CTLD.airbase_logistics_radius` in `mission.yaml` to the **largest** airfield your
    transports start from. It is one value for every airfield of the mission — it cannot be set per
    field — so a mission whose C-130s or helicopters start from a major air base needs it raised.
    Only Ramstein is measured: **1 100 m** covers the stand DCS gave a C-130 at Ramstein
    and the six nearest large-aircraft stands. A larger circle costs nothing but its size on the F10
    map. Otherwise, taxi into the green circle. For a field with no parking data, place an `LGZ_`
    trigger zone in the Mission Editor.

- id: destroy-by-name-reads-unitname
  kind: tool
  area: runtime
  title: "`_destroy, name X` ignores the name and destroys everything within 150 m of the marker"
  fixed_in: "6.28.0"
  symptom: |
    The `_destroy` handler reads the `unitname` option; `name` fills another field it never looks at.
    With no `unitname`, it falls back to the radius form: every unit and static within 150 m of the marker is destroyed, the named one only if it happens to be there.
    The mission-maker page showed `_destroy, name Tank-1` as the example. Found on 2026-10-04 while reading the code for FEAT-CAP-WATCHDOG, not measured in game.
  workaround: |
    Write `_destroy, unitname Tank-1` — it destroys the unit, static or group of that exact name, wherever it is.
  cost: |
    A marker meant to remove one named unit removes whatever stands near the marker instead.

- id: no-airplane-spawn-from-a-marker
  kind: tool
  area: runtime
  title: No airplane can be spawned from a map marker, except as a static
  symptom: |
    `_spawn unit, name F-16C_50` (or any airplane type) answers *"Airplanes cannot be spawned from a
    marker at the moment (helicopters can)"* and spawns nothing; `static` places it as a static
    object, which does not fly. Helicopters are spawned from a marker since FEAT-HELICOPTER-SPAWN
    (#164), landed or with a `task`.
  workaround: |
    `-cap` (or `_spawn cap`) clones a `veafSpawn-` airplane template with a patrol; `-escort` clones
    one to escort the airplane next to the marker; `-awacs` spawns an AWACS from its type, no template
    needed. Otherwise place the group in the Mission Editor: inside a combat zone, which spawns it with
    the zone, or late-activated and activated by a trigger or a script.

- id: spawned-awacs-cannot-be-moved
  kind: tool
  area: runtime
  title: An AWACS spawned with `-awacs` cannot be moved or respawned, nor can its escort
  symptom: |
    `_move tanker` and the F10 assets menu read a group's Mission Editor record, and a group spawned
    during the mission has none: they refuse the `-awacs` AWACS and the escort `-awacs, escort` or
    `-escort` gave it. The AWACS is also spawned with no callsign of its own: DCS chooses one.
  workaround: |
    Spawn a new AWACS with `-awacs` where it is needed, and remove the old one with `_destroy`. For an
    AWACS that must be moved or respawned from the assets menu, place it in the Mission Editor.

- id: scripted-helicopter-leaves-the-ground
  kind: dcs
  area: spawning
  title: "A helicopter added by script on open ground takes off on its own unless it is `uncontrolled`"
  measured: "2026-10-02"
  symptom: |
    Five Mi-8MT added with `coalition.addGroup` on the Kobuleti runway, side by side, watched for
    five minutes:

    | Group data | What DCS did |
    |---|---|
    | no route | engine started at once, **hovered 5–12 m up** for five minutes |
    | one `TakeOffGround` point | sat cold, engine started at T+80 s, **took off at T+278 s**, landed at T+466 s |
    | one `TakeOffGroundHot` point | took off at T+11 s, landed at T+193 s |
    | `TakeOffGround` + `uncontrolled = true` | stayed on the ground, engine off |
    | category `AIRPLANE` | refused: `Invalid Unit Module: "Mi-8MT"`, no group |

    None of this raises an error: the group exists, `isExist()` is true, and a helicopter meant to
    sit as a target is gone a few minutes later.
  workaround: |
    To keep a scripted helicopter where it was put, give it one `TakeOffGround` waypoint **and**
    `uncontrolled = true`. Whether the controller's `Start` command then wakes it up is not measured.
  cost: |
    Measured for FEAT-HELICOPTER-SPAWN (DCS-SESSION-TODO R23): the obvious fix — submitting the
    group under `HELICOPTER` — would have produced a hovering helicopter.

- id: helicopter-land-waypoint-goes-to-the-nearest-airfield
  kind: dcs
  area: spawning
  title: "A scripted helicopter given a `Land` waypoint lands on the nearest airfield's parking, not on the point"
  measured: "2026-10-02"
  symptom: |
    A Mi-8MT added by script on the Kobuleti runway with a waypoint of type `Land`:

    | `Land` point | What it did |
    |---|---|
    | 1.2 km away, at the other end of the runway | passed 291 m from it, came back round, landed **1 678 m from it** on Kobuleti's parking |
    | 3 km away on open ground, 2.85 km from the field | passed 193 m from it at 59 m/s, turned back, landed on Kobuleti's parking again |

    (DCS-SESSION-TODO R24, R25.) No error: the group exists, it is on the ground, not where it was sent.
  workaround: |
    Give the helicopter a `Land` **task** (`{ id = "Land", params = { point, durationFlag } }`) on a
    turning point instead of a `Land` waypoint.
  cost: |
    The first two readings of `task transport` (FEAT-HELICOPTER-SPAWN).

- id: helicopter-hovers-at-a-forest-edge
  kind: dcs
  area: spawning
  title: "A scripted helicopter given a `Land` task in a forest hovers at its edge and never lands"
  measured: "2026-10-02"
  symptom: |
    A Mi-8MT given a `Land` task on a point inside a forest, near Kobuleti, flew to it, slowed, and
    then hovered **8 to 34 m above the open field at the forest's edge, 106–121 m from the point**,
    for minutes, without touching down (DCS-SESSION-TODO R26, R27; David watching). The same task on
    open grass put it down 30 m from its point in 90 s (R28).
  workaround: |
    Send a helicopter to open ground. `task transport` moves the landing point to a clearing within
    300 m when the scenery search finds one, but that search accepts gaps of 10 m, and the DCS call
    under it is a lottery (`disposition-getsimplezones-is-a-lottery`).

- id: airfield-logistics-class-is-decided-when-ctld-starts
  kind: tool
  area: runtime
  title: Whether an airfield needs two minutes of ground occupation is decided when CTLD starts
  symptom: |
    The airfield's coalition at the moment `veaf.ctld_initialize()` runs decides its class, once. A
    field held then opens its CTLD logistics straight away and keeps it while that coalition holds
    it. A field that is neutral then — or that a mission script hands to a coalition later — opens
    only after two continuous minutes of unopposed **ground** units within `airbase_occupation_radius`,
    and closes when they leave. Giving a field to a side by script does not, on its own, open it.
  workaround: |
    Set the airfield's coalition in the Mission Editor rather than by script at start, or put ground
    units of that side on the field for two minutes.
- id: metar-weather-keeps-one-cloud-layer
  kind: tool
  area: pipeline
  title: A METAR's weather is flown with its last cloud layer only
  symptom: |
    The weather injector reads every cloud group of a `metar:` or an `airport_icao:` report into the
    same single layer, so the last one wins. Measured on 2026-10-02 on the Syria Open Training v6:
    `LTAG ... SCT030 BKN090 ...` flies BKN at 2743 m (9000 ft), and the scattered layer at 900 m is
    not in the sky. A `clearsky: true` variant's `${METAR}` is recomposed from that one layer too
    (`FEW090`).
  workaround: |
    Write a `metar:` with the one layer that matters, or a `weather:` mapping with its `cloud_type`
    and `cloud_height`.
- id: operation-spawns-all-its-zones-at-once
  kind: tool
  area: runtime
  title: Activating a combat operation spawns all its zones at once — `dependencies` orders the tasks, not the units
  symptom: |
    `VeafCombatOperation:activate` activates every zone of its `tasking_orders` in the same pass. A
    task with `dependencies` is only *listed* as the current objective once the zones it depends on
    are done; its units are already on the map from the start, and can be destroyed early.
  workaround: |
    For an objective that must not exist before another is done, make it a `chained_zones` of that
    zone (with `chained_delay`) instead of a task of the operation — knowing it then does not count
    towards the operation's "Operation … is over" message.
- id: briefing-pictures-red-then-blue
  kind: dcs
  area: players
  title: A player whose side the briefing does not know sees the red pictures, then the blue ones
  measured: "2026-09-29"
  symptom: |
    The mission's briefing pictures are three lists, `pictureFileNameR`, `pictureFileNameB` and
    `pictureFileNameN`. DCS's briefing (`MissionEditor/modules/me_autobriefing.lua`) picks the list of
    the player's side, and it knows that side only from a unit whose skill is `Player`. With none —
    a `Client` slot (a test mission flown from one included), a dynamic slot, a spectator — it shows
    **the red list followed by the blue one**. A picture put in both lists, the natural way to "show
    it to everyone", is shown twice: seen on GermanyCW-v6, in a case not written down.

    Read in DCS's Lua on 2026-09-29, not observed slot by slot. The in-flight and multiplayer
    briefing takes its pictures from the engine (`DCS.getPlayerBriefing()`,
    `Scripts/UI/BriefingDialog.lua`), whose rule cannot be read: whether a multiplayer pilot in a
    red slot gets the red list is **to be confirmed**.

    The panel also fits each picture to its own size: a theatre map 1600 px wide is shrunk until its
    labels cannot be read. The mouse wheel zooms, which few players know.
  workaround: |
    Put every picture in `pictureFileNameB` and `pictureFileNameN`, and leave `pictureFileNameR`
    empty: whoever DCS cannot place sees each picture once. The cost falls on a red player DCS does
    identify: they may get no picture. Keep that for missions whose red classic slots do not need the map
    (an arena), and say so in the briefing text.

    Against the fitted panel, add zoomed maps after the theatre map, one per area, each with a title.
  cost: |
    Found on GermanyCW-v6, whose briefing showed its map twice, too small to read.
- id: player-leaves-slot-after-dcs-forgot-the-player
  kind: dcs
  area: players
  title: A departing player's last slot change arrives after DCS has forgotten the player
  measured: "2026-09-30"
  symptom: |
    When a player disconnects, DCS fires the hook callback `onGameEvent("disconnect", id)` and then
    `onPlayerChangeSlot(id)`, and by that second call `net.get_player_info(id)` returns nil. Measured
    on the six VEAF servers' `dcs.log`, 2026-09-29 18:04 → 2026-09-30 17:45: 21 disconnects, 21 slot
    changes with no player info, each right after the disconnect of the same id, none anywhere else.
  workaround: |
    A hook reading the player in `onPlayerChangeSlot` must accept nil, and can tell this ordinary case
    from an unexplained one by remembering the ids `onGameEvent` reported disconnecting — which is what
    `VEAF-Server-hook.lua` does.
  cost: |
    The VEAF hook logged it at ERROR, once per departure: on private1 it was the first suspect for an
    unrelated security defect until its context was measured.
- id: radio-lua-is-not-what-the-f10-view-shows
  kind: dcs
  area: radio
  title: "The text of `Radio.lua` is not the airfield frequencies DCS uses — DCS completes the missing bands"
  measured: "2026-10-01"
  symptom: |
    `Mods/terrains/<T>/Radio.lua` looks like the airfields' ATC frequencies, and holds fewer than DCS
    uses. The Mission Editor (`MissionEditor/modules/Mission/AirdromeData.lua`) asks DCS for them with
    `DCS.getATCradiosData(radioId)`, which returns bands the file does not hold. Measured on Persian
    Gulf: `radio.lua` gives Al Dhafra **one** frequency, 126.5 VHF, and DCS returns **four** — 39.5,
    126.5, 251.1 and 4.3, what the editor's airport panel shows; Bandar-e-Jask has `frequency = {}` in
    the file and four bands in DCS. Every Persian Gulf entry of `radio.lua` carries VHF only. Where
    DCS completes them is not visible in the install.
  workaround: |
    Take an airfield's frequencies from the reference shipped with the tools
    (`veaf_libs/data/airfield-frequencies.yaml`, captured from a running DCS with the editor's own
    logic) — through `describe_airfield_channels` / `set_airfield_channels`, or
    `veaf-tools content airfield-channels` — never from `Radio.lua`, and never typed by hand.
  cost: |
    The tools' reference was parsed from the text of `Radio.lua`: on Persian Gulf it held no UHF channel
    for any airfield, and made the hand-written channel collection — which was right — look wrong.
- id: destroyed-static-is-still-returned-by-getbyname
  kind: dcs
  area: spawning
  title: "`StaticObject.getByName` keeps returning a static after its destruction"
  measured: "2026-10-01"
  symptom: |
    A static destroyed in game is still found by name: `StaticObject.getByName` returns an object whose
    `isExist()` is **false** and `getLife()` is **0**, and which still answers `getCoalition()`.
    Measured on Caucasus with a red `Ural-375` static blown up by `trigger.action.explosion` (power 500):
    10 s and 70 s after the explosion, both reads gave `isExist=false life=0`.
  workaround: |
    Never take "found by name" for "still there": test `isExist()` and `getLife() > 0`.
    `veafCombatZone.getStandingStatic` does both, and is what the combat zone watchdog and its F10
    report now use.
  cost: |
    The combat zone watchdog counted every static it found, so **a zone holding a static never
    completed** — and the F10 report kept listing the destroyed targets. Found by the test mission of
    FEAT-OBJECTIVE-MISSION-PROMPT, whose static zone stayed open with its truck destroyed.
- id: destroyed-units-are-still-found-by-searchobjects
  kind: dcs
  area: spawning
  title: "`world.searchObjects` still finds ground units after their destruction"
  measured: "2026-10-06"
  symptom: |
    A volume search (`world.searchObjects(Object.Category.UNIT, …)`) around a garrison destroyed by
    explosions keeps returning its units with their coalition, as if they still held the ground.
    Measured on Caucasus at Senaki with a red garrison killed by `-shell`: without a filter the zone
    stayed contested by red for minutes, two blue M1A2 in it and no live red unit on the F10 map; with
    `isExist()` and `getLife() >= 1` tested, the same search right after the last death answered nobody.
    Which of the two tests rejects the wrecks was not isolated.
  workaround: |
    Filter every object a search returns: `isExist()` true and `getLife()` at least 1.
    `veafCampaign.holdsGround` does both.
  cost: |
    A campaign zone whose garrison was destroyed could never be captured: the wrecks held it for the
    side that had lost it. Found in the first two-mission test of FEAT-MULTI-MISSION-CAMPAIGN.
- id: unit-getbyname-misses-units-sharing-a-name
  kind: dcs
  area: spawning
  title: "`Unit.getByName` answers nil for units that share a name"
  measured: "2026-10-06"
  symptom: |
    DCS accepts two units with the same name — it spawns both — but then resolves neither by that name.
    On the v6 demo test mission, `[r]-Armored Platoon#10344` held two units both named
    `[r]-Armored Platoon#10344 - MBT T-72B` (ids 200108 and 200109): `Unit.getByName` of that name
    returned **nil**, and `veaf.findUnitsInCircle`, whose result is keyed by name, returned it once.
    A first reading on 2026-10-05 blamed the « [CH] » vehicle pack; the units it could not resolve had
    duplicate names.
  workaround: |
    Give every unit a unique name — `veafSpawnGround` numbers them `<group> - <type> #<n>` since
    FIX-DUPLICATE-UNIT-NAMES. And once you hold the object — from `coalition.getGroups`,
    `Group:getUnits`, a search — act on the object rather than looking it up again by name, as
    `veafSpawn.destroy` (radius) and `veafMove.changeTanker` do since FIX-DEMO-RECETTE-FINDINGS.
  cost: |
    `_destroy, radius 2000` (`-menage`) left both tanks alive at 1 358 m and 1 405 m: the name lookup
    missed them, and nothing said so.
- id: aircraft-at-the-end-of-its-route-lands
  kind: dcs
  area: spawning
  title: "An aircraft spawned with a single waypoint and no task lands at the nearest airfield"
  measured: "2026-10-01"
  symptom: |
    A group whose route is one waypoint at its own position has reached the end of its route the
    moment it exists, and DCS does what it does then: it lands. Measured in the Tacview of *Ligne
    rouge d'At Tanf*: the Sayqal QRA pair of MiG-29S appeared at **5 262 m**, descended in turns,
    flared on runway 090 at 695 m and was gone **four and a half minutes** after appearing — three
    scrambles (2 700 s, 3 990 s, 5 160 s), no interception. Nothing raises; the group simply never
    does what it was placed for.
  workaround: |
    Give a flight a route that keeps it busy (an orbit, a `SwitchWaypoint` loop) and a task. A QRA or
    an air wave does it for a group tasked `CAP` or `Intercept` whose route engages no aircraft: it is
    cloned with the `zone_defense` role (FEAT-AIRCRAFT-ROLES), and the build says so. Any other group
    placed this way still lands.
  cost: |
    Three scrambles of a QRA that defended nothing, on a mission built by the MCP's `create_qra`.
- id: dcs-ground-is-never-below-sea-level
  kind: dcs
  area: spawning
  title: "`land.getHeight` never answers below 0: ground under sea level reads 3 m on Syria"
  measured: "2026-10-01"
  symptom: |
    The whole Syria map swept every 250 m (12.1 M points, `veaf-tools dcs terrain-sweep`) holds no
    height below 0: the sea reads 0, and every point measured where the real ground lies under sea
    level reads **exactly 3 m** — Lake Tiberias (real surface about −210 m), the Jordan valley at
    Beit She'an, Jericho (about −250 m), the north of the Dead Sea (about −430 m). The real figures
    are approximate, from general knowledge; the DCS ones are measured.
  workaround: |
    Take a ground height from DCS's terrain (`terrain_elevation`), never from a real-world source:
    in the Jordan rift the two differ by hundreds of metres, and it is DCS's that the aircraft flies
    over.
  cost: |
    None yet — found while sweeping the elevation grid. A briefing that took a target's altitude from a
    real-world map would have given a negative figure DCS does not have.
- id: dcs-scripted-static-ignores-hidden
  kind: dcs
  area: spawning
  title: "A static created by script shows on the F10 map even when it is submitted `hidden = true`"
  measured: "2026-09-19"
  symptom: |
    Measured by Tripack on a v6 Cyprus mission, from a blue Hornet slot and as Tactical Commander
    (#953): the neutral sandbags placed **hidden** in the Mission Editor and touched by no script stay
    off the map, while the identical ones a combat zone puts back — removed by deactivating the zone,
    recreated by activating it again — are on the map. VEAF submits `hidden = true` to
    `coalition.addStaticObject` for them (`test_the_static_the_zone_puts_back_is_still_hidden`), so it
    is DCS that does not apply it to an object a script created. A **group** behaves the other way,
    measured on 2026-10-03: a Su-27 pair `hidden = true` in the editor, recreated twice by
    `coalition.addGroup` as a QRA, never showed on a blue F10 map (`optview_all`) that did show a
    non-hidden red Shilka and red MiG-29S. DCS keeps `hidden` on a recreated group, drops it on a
    recreated static.
  workaround: |
    Keep a decoration that must stay hidden out of every combat zone, or name it so that no zone takes
    it over: the editor's own copy is the only one DCS hides.

- id: aircraft-spawned-too-low-is-not-lifted
  kind: dcs
  area: spawning
  title: "An aircraft spawned a few metres above the ground is not lifted: it flies into what stands there"
  measured: "2026-10-03"
  symptom: |
    `coalition.addGroup` takes an aircraft's altitude as given. A MiG-21 spawned 15 m above flat
    farmland in Caucasus (`_spawn cap, side red, alt 2`) was in the air, hit shrubs and trees within a
    second (`HIT` on `SHRUB`, `GREEN_ASH`, `EUROPEAN_BEECH`) and crashed (`PILOT_DEAD`, `CRASH`).
    Nothing raises: the spawn succeeds and the aircraft dies.
  workaround: |
    Spawn an aircraft well above what stands on the ground. Not being under the terrain is not enough.
    VEAF floors every aircraft it gives a role (`-cap`, a QRA or a wave defending its zone) at
    `veafAircraftSpawn.MINIMUM_CLEARANCE_METRES` (150 m) above the ground under its spawn point, spawn
    and patrol alike; the MiST-derived spawner lifts a requested altitude into a band for the same reason.
  cost: |
    `FIX-AIR-SPAWN-ALTITUDE-GUARD` had to choose between refusing and lifting; this measurement is what
    settles that refusing only a point under the terrain leaves the crash in place.

- id: colour-enums-are-capitalised
  kind: dcs
  area: spawning
  title: "`trigger.smokeColor` and `trigger.flareColor` keys are `Red`, `Green`… — `RED` is nil, and DCS then refuses the call"
  measured: "2026-10-03"
  symptom: |
    Read in game: `trigger.smokeColor` is `Blue=4 Green=0 Orange=3 Red=1 White=2` and
    `trigger.flareColor` is `Green=0 Red=1 White=2 Yellow=3`. `trigger.smokeColor.RED` is `nil`, and
    `trigger.action.smoke(point, nil)` raises "Parameter #2 (color) missed" — inside a scheduled
    function that is a line in `dcs.log` and no smoke. The two tables also disagree from 3 up: smoke 3
    is orange, flare 3 is yellow; smoke 4 is blue, and there is no flare 4.
  workaround: |
    Write the keys as DCS does, and never pass a smoke colour where a flare colour is expected beyond
    red, green and white.
  cost: |
    Every coloured smoke and flare asked from a VEAF map marker, and the smokes and flares of `-farp`,
    failed this way until `FIX-IN-GAME-SESSION-2026-10-03`; the unit tests compared `nil` with `nil`.

- id: deactivated-zone-site-stays-in-the-iads
  kind: tool
  area: runtime
  title: "A combat zone's SAM site stays in the Skynet network after the zone is deactivated"
  symptom: |
    Measured on 2026-10-03 on Tripack's `Skynet-test` (#946): deactivating and reactivating `TESTCZ`
    added the zone's new SA-6 to the network and left the old one listed for more than four minutes,
    although DCS no longer held its group. Each cycle adds one site to the status page's count. The
    sweep meant to remove despawned sites (`FIX-SKYNET-ADDS-DESTROYED-GROUPS` ticket 03) did not.
  workaround: |
    Read the status page's site count as "at most": a zone cycled N times may list N dead sites of its
    own. The live sites still detect and fire normally.

- id: a-dcs-object-is-its-id
  kind: dcs
  area: spawning
  title: "A Group or Unit object kept in a script follows its id: a group created later with the same id answers for it"
  measured: "2026-10-03"
  symptom: |
    A DCS object handed to a script is `{ id_ = n }` and nothing more. A combat zone deactivated
    (`Group:destroy()`) and activated again respawned its SA-6 under a new name, `#10211` → `#10212`,
    with the template's group id, 44, both times. The `Group` object Skynet had kept for `#10211`
    then answered `isExist() == true`, `getSize() == 5` and `getName() == "…#10212"`, while
    `Group.getByName("…#10211")` returned nil. Nothing raises: the old object simply speaks for the
    new group.
  workaround: |
    Never take "the object I kept still exists" for "the thing I kept still exists". Look it up by
    name, or compare the name it answers with the one you stored — which is what the Skynet sweep of
    `veafSkynetIadsHelper.lua` does since FIX-IN-GAME-SESSION-2026-10-03.
  cost: |
    The vanished-sites sweep, written to drop a deactivated zone's SAM site from the IADS, kept every
    such site for the rest of the mission: one more site per deactivation and reactivation.

- id: cap-engages-only-through-an-engage-task-before-its-orbit
  kind: dcs
  area: air-defence
  title: "A CAP flight engages nothing without an `EngageTargets` task, and a task numbered after its endless orbit is never read"
  measured: "2026-10-03"
  symptom: |
    The group's main task `CAP` does not make it fight. Three MiG-29S pairs on GermanyCW, identical
    but for the task list of their first waypoint, each with an immortal C-130 orbiting 12 km away
    and detected by its lead (`getDetectedTargets`): with `EngageTargets` (`key = "CAP"`, `Air`)
    numbered **before** the race-track `Orbit`, the pair fired its first R-77 74 s after it was
    activated and four missiles within 3.5 minutes; with no `EngageTargets`, and with the same task numbered **after** the
    `Orbit`, both pairs held fire for four minutes at 8.5 km from a target they had detected.
  workaround: |
    Give every CAP an `EngageTargets` (or `EngageTargetsInZone`) task numbered before its `Orbit`, as
    the Mission Editor does when the CAP task is chosen. `create_cap_mission` writes it that way, and
    `edit_route add_task` takes `task_position` to insert a task before an orbit instead of appending.
  cost: |
    The on-demand CAPs `create_cap_mission` built before FIX-SCRATCH-MISSION-FINDINGS ticket 17 carried
    an `Orbit` alone: they patrolled and never fought.

- id: heavy-aircraft-on-a-small-fighter-stand-is-moved-or-clips
  kind: dcs
  area: spawning
  title: "A heavy aircraft spawned on a `SmallSizeFighter` stand (`Term_Type` 100) is moved elsewhere without a word, or seated inside a hangar"
  measured: "2026-10-03"
  symptom: |
    `coalition.addGroup` accepts the request and raises nothing either way. Three C-130s on GermanyCW,
    each asked for the free type-100 stand of one airfield (`parking` = its `Term_Index`), read 10 s later:

    | Airfield, stand | Where the C-130 ended up |
    |---|---|
    | Wittstock #97 | on the stand, 1.8 m off it — **2 m from a `HANGAR_COVERED_02_GREEN`**, i.e. inside it |
    | Altes Lager #93 | **1 473 m away**, on stand #67 (type 104) |
    | Bremen #13 | **339 m away**, on stand #1 (type 104) |

    Type 100 is not Syrian only, as the parking captures of Caucasus, Persian Gulf and Syria
    suggested: GermanyCW has some too (Ramstein, Wittstock, Altes Lager, Bremen at least).
  workaround: |
    Seat an aircraft only on the stand types its airframe fits: the tools offer 68, 72 and 104
    (`AIRCRAFT_STAND_TYPES`) and leave 100 out. After spawning on a named stand, read the unit's
    position back rather than trusting the stand you asked for.

- id: mobile-zone-drawing-stays-put
  kind: tool
  area: runtime
  title: "The map drawing of a QRA or air-wave zone that follows a unit does not move with it"
  symptom: |
    A zone declared with `follow_unit:`, or a trigger zone linked to a unit in the Mission Editor,
    follows its unit for detection and spawning. Its `draw_zone` outline is drawn once, where the
    unit stood when the zone started, and stays there while the carrier sails on.
  workaround: |
    Leave `draw_zone` off for a mobile zone, or restart the zone (radio menu `qra.start` /
    `airwave.reset`) to draw it again where the unit now is.

- id: radio-lua-action-stops-the-config
  kind: tool
  area: pipeline
  title: "A `lua` action in `modules.RADIO.user_menus` stops the whole VEAF configuration at load"
  fixed_in: "6.28.0"
  symptom: |
    The action was written as a bare reference (`demo.spawnCsar`), evaluated when `veaf-config.lua`
    loads — before `mission-script.lua`, where the documentation tells you to define the function.
    The load fails on `attempt to index global '<table>' (a nil value)` and nothing after that line of
    the configuration runs. `validate` and the build pass: they only check that the name appears in
    the mission's Lua. Found on the v6 demo mission, 2026-10-05.
  workaround: |
    Build the menu in your own Lua (`veafRadio` in `mission-script.lua`) rather than with an
    `action: lua` entry, or define the function in a script loaded before `veaf-config.lua`.
  cost: |
    No combat zone, QRA, asset or IADS: every module initialised after the radio menu was lost.

- id: ctld-config-end-of-line-comment
  kind: tool
  area: pipeline
  title: "An end-of-line comment in `ctld-config.yaml` becomes part of the value CTLD reads"
  fixed_in: "6.28.0"
  symptom: |
    CTLD reads its configuration with its own YAML reader, which keeps `# …` after a value:
    `jtacLaserCodeMax: 1686   # note` becomes the string `"1686   # note"`, and CTLD's JTAC init fails on
    `'for' limit must be a number`. Standard YAML — and so `validate` and the build — read `1686`.
    Seen on the v6 demo mission, 2026-10-05. The same build could also embed the **previous** build's
    configuration: a stale `src/scripts/CTLD_userConfig.lua` won over the one just generated.
  workaround: |
    Put every comment of `ctld-config.yaml` on its own line, and build twice after editing the file.
  cost: |
    Up to 6.27, one module's init error also stopped every module after it: the demo mission was left
    with no combat zone, QRA, asset or IADS.

- id: build-exits-1-with-a-null-stdin
  kind: tool
  area: pipeline
  title: "`mission build … > /dev/null` from Git Bash writes the `.miz` and exits 1"
  fixed_in: "6.28.0"
  symptom: |
    Windows answers `isatty()` true for `NUL`, so the launch passed for a double-click and the closing
    « Press Enter » pause raised `EOFError`, replacing the command's exit code. A script testing the
    code read a failed build. Measured on the v6 demo mission folder, 2026-10-05.
  workaround: |
    Set `VEAF_UPDATER_NO_PAUSE=1`, or redirect the output to a file rather than to `/dev/null`.

- id: cargoships-spawn-nothing-at-sea
  kind: tool
  area: runtime
  title: "`-cargoships`, `-escortedcargoships` and `-combatships` spawn nothing at sea, silently"
  fixed_in: "6.28.0"
  symptom: |
    The group's centre was searched on land, so a ship group found no point at sea and no group was
    created; the only trace was an INFO line, and nothing on screen from a combat zone's command.
    Measured in DCS on the v6 demo mission, 2026-10-05.
  workaround: |
    Place the ships in the Mission Editor (in a combat zone, as native groups of the zone).

- id: operation-has-no-activation-command
  kind: tool
  area: runtime
  title: "A combat operation's radio menu has no activate / deactivate command"
  fixed_in: "6.28.0"
  symptom: |
    The commands were commented out: an operation not `active_at_start` could only be started by
    script (`veafCombatZone.ActivateZone("<name>")`) or the `-zonestart` marker command. Seen on the
    v6 demo mission, 2026-10-05.
  workaround: |
    `active_at_start: true`, the `-zonestart` marker command, or a menu of your own calling
    `veafCombatZone.ActivateZone`.

- id: campaign-records-more-than-it-replays
  kind: tool
  area: runtime
  title: "A campaign mission records destroyed scenery, SAM missiles left and warehouse stocks, but the next mission does not replay them yet"
  symptom: |
    The state file of a multi-mission campaign carries the scenery destroyed in flight, the missiles
    each surviving air-defence unit has left and every campaign airbase's warehouse content
    (FEAT-MULTI-MISSION-CAMPAIGN, tickets 06 and 07). The next mission starts with a bridge standing
    again, a SAM fully loaded and its airbase stocked as the template says: how to make an object
    start destroyed, whether a unit can start a mission with fewer missiles, and how exact the
    warehouse counts read in flight are, are still to be measured in game.
  workaround: |
    Garrisons, their losses, owners, captures and reserves are replayed. For a bridge or a depot that
    must stay down, make it a zone (`kind: logistics` for a depot) rather than relying on the scenery.

- id: airbase-getpoint-is-not-the-runways-centre
  kind: dcs
  area: spawning
  title: "`Airbase:getPoint()` lands about a kilometre from the runways' centre"
  measured: "2026-10-08"
  symptom: |
    On 13 theatres, the point `getPoint()` returns for an airdrome is 300 m to 1.4 km (median per
    theatre) from the middle of its runway thresholds, where the terrain's reference point — what the
    Mission Editor and the `dcs-world-schema` reference data give — sits at a median 0 m. Nothing
    says so: it is a valid point on the airfield's side. VMCT's airfield positions were captured with
    `getPoint()` until FEAT-DCS-REFERENCE-DATA moved them to the reference point.
  workaround: |
    For "where is this airfield", use the shipped positions (`list_airfields`), which are the
    reference points. In game, take a runway's position from `Airbase:getRunways()` rather than
    `getPoint()` when the runway is what matters.

- id: livery-is-not-validated
  kind: tool
  area: mcp
  title: The MCP writes a livery id without checking it exists for the type or the country
  symptom: |
    `set_unit_properties` stores any `livery` it is given and warns that it is not validated. DCS
    shows the default skin for an id it does not find, without an error. The `dcs-world-schema`
    reference data cannot back a check: it misses zipped liveries, most of the modules' (2 of 52 for
    the F-16C, measured 2026-10-08), and a squadron or mod skin installed on a server is legitimate
    and absent from any stock list.
  workaround: Check the livery in the Mission Editor, or copy it from a unit that already shows it.
- id: a-convoy-drives-through-an-ambush
  kind: dcs
  area: ground-ai
  title: "A convoy under fire drives on, and its `getDetectedTargets` can stay empty"
  measured: "2026-10-08"
  symptom: |
    Measured on Caucasus east of Kutaisi, a blue convoy (armed HMMWV, Stryker, two M818) driven along a
    road into two BMP-2 and a BTR-80 placed 400 m off it: the ambush opened fire at ~1.3 km and the
    convoy **drove on at 10 m/s without firing a round** until its four vehicles were dead. Its group
    `getDetectedTargets()` stayed **empty for 45 s under fire**, until one vehicle was left. The same
    road with a Bradley in the convoy: an enemy detected at 1 227 m, 10 s before the first shot.
    `S_EVENT_SHOOTING_START` carries its target (a convoy unit) and its shooter; some `S_EVENT_HIT` by
    shells carry a nameless initiator; a truck's explosion raises `S_EVENT_HIT` on its neighbours with
    the truck as the initiator.
  workaround: |
    Do not wait for DCS to notice: watch for the enemy yourself (`world.searchObjects`, then
    `land.isVisible`) and react to `S_EVENT_SHOOTING_START` / `S_EVENT_HIT`, ignoring a same-coalition
    initiator. `veafGroundAI`'s convoy watch does it (FEAT-CONVOY-UNDER-FIRE).
  cost: |
    Every convoy of every mission was a sitting duck: the reason for FEAT-CONVOY-UNDER-FIRE.
- id: a-new-route-under-fire-moves-only-the-lead
  kind: dcs
  area: ground-ai
  title: "A ground group given a new route under fire: only its lead obeys"
  measured: "2026-10-08"
  symptom: |
    Alarm state red, ROE open fire and a new `Mission` task set at the first shot on a five-vehicle
    convoy: the **lead** turned and drove back within 3 s, and the convoy returned fire, but the rest
    of the column stayed where it was — a truck still on the road, destroyed, another damaged. Off
    road, the lead itself bogged down at 0.6 m/s on a 9 km straight line across country.
  workaround: |
    A group moves as one: to make some vehicles leave while others stay, respawn them as their own
    group (`coalition.addGroup` where they stand) and route that one. Keep off-road legs short.
- id: smoke-does-not-blind-the-ai
  kind: dcs
  area: ground-ai
  title: "Smoke does not blind DCS's AI"
  measured: "2026-10-08"
  symptom: |
    Three `trigger.action.effectSmokeBig` (preset 7) set between two BMP-2 and their target 350 m away:
    the BMPs **kept detecting all three targets and firing** — about 300 hits in the next 60 s, the
    rate falling only because their 30 mm HE ran out.
  workaround: |
    A smoke screen is for the players' eyes, never cover. Use smoke to mark (`trigger.action.smoke`),
    as the convoy's call for help does.
- id: searchobjects-finds-no-trees
  kind: dcs
  area: ground-ai
  title: "`world.searchObjects` finds no tree"
  measured: "2026-10-08"
  symptom: |
    A `SCENERY` search of 3 km radius east of Kutaisi returned 117 objects — houses, garages, bridges,
    39 light poles — and **no tree**. `land.isVisible` does not account for them either.
  workaround: |
    Forest cannot be found by script as cover; only terrain (`land.isVisible`) and the towns
    (`veafCities`) can. `Disposition.getSimpleZones` knows where forests are, with the caveats of
    `disposition-getsimplezones-is-a-lottery`.
- id: ground-ai-does-not-see-what-isvisible-sees
  kind: dcs
  area: ground-ai
  title: "Ground AI does not see an enemy `land.isVisible` says is in sight, and `knowTarget` does not make it"
  measured: "2026-10-08"
  symptom: |
    Two Bradleys halted 1.9 km from a BMP-2 and a BTR-80 on flat ground, in sight by `land.isVisible`:
    in two minutes **neither side fired a round**; the Bradleys' unit-level `getDetectedTargets` stayed
    at 0, and neither `Controller.knowTarget(enemy, true, true)` on each unit nor a `FireAtPoint` task
    on the group made them fire (seven TOW still aboard). Sent forward, they opened fire at ~1.3 km and
    destroyed both in 16 s. Earlier the same day, stationary trucks 1 km from BMPs, in sight by
    `isVisible`, were never engaged in five minutes; at 350 m at once. Vegetation is the likeliest mask.
  workaround: |
    To make ground units fight an enemy you can see by script, send them closer — `veafGroundAI`'s
    convoy closes in to 900 m.
- id: addgroup-with-an-existing-name-replaces-the-group
  kind: dcs
  area: spawning
  title: "`coalition.addGroup` with the name of an existing group replaces it"
  measured: "2026-10-08"
  symptom: |
    A two-truck group spawned, then `coalition.addGroup` called again with the same group name and three
    trucks: one group of that name afterwards, **the same group id**, three units, and the first group's
    units gone (`Unit.getByName` nil) — in the same call and three seconds later.
  workaround: |
    Rebuilding a group under its own name is a replacement, not a duplicate; it is how the convoy merges
    its unarmed vehicles back. It cannot carry damage over: the units come back whole.
