# Known limitations — what an agent or a mission maker must know before building a mission.
#
# ONE source, read by the MCP action `describe_known_limitations` (shipped in the executable) and
# rendered into docs/agents/dcs-runtime-traps.md for readers of the repository. Never copy an entry
# by hand anywhere else: point to the action, or regenerate the page
# (`poetry run python -m veaf_libs.known_limitations`).
#
# Two kinds of entry:
#   tool  a limitation of veaf-tools / the MCP. Fixed one day: set `fixed_in` to the release that
#         fixes it and the action stops returning it from that version on.
#   dcs   a behaviour of DCS World that raises no error and is wrong anyway. Never "fixed": always
#         returned. Record the measurement — the value, the date, what it broke — not a conclusion.
#
# Lot rule (CLAUDE.md §9): a lot that finds a limitation without fixing it adds it here; a lot that
# fixes one sets its `fixed_in`; a surprising DCS behaviour, measured, goes here too.
#
# Fields: id (unique, kebab-case), kind (tool|dcs), area, title, symptom, workaround, cost (what it
# broke; optional), measured (YYYY-MM-DD, required for dcs), fixed_in (tool only, optional).
# `area` groups the entries: spawning, air-defence, players (dcs); mcp, pipeline, runtime (tool).
# symptom / workaround / cost are Markdown.

limitations:
- id: late-activated-group-is-visible
  kind: dcs
  area: spawning
  title: A late-activated group is fully visible to the scripting API before it is activated
  measured: "2026-09-21"
  symptom: |
    On a group whose activation was still thirty seconds away:

    | Asked | Answer |
    |---|---|
    | `coalition.getGroups(side, category)` | **returns it** |
    | `Group:isExist()` | **true** |
    | `Unit:isExist()` | **true** |
    | `Unit:inAir()` | **true** |
    | `Unit:isActive()` | **false** — the only one that tells the truth |

    `lateActivation = true` hides a group from the map and from nothing else.
  workaround: |
    When sweeping for real units, test `Unit:isActive()`. `veaf.isUnitAlive(unit)` already does it
    (`unit:isExist() and unit:isActive()`) and is the right thing to call.
  cost: |
    The one shipped product bug on this list: `veafSkynet.listHostileAircraft` reported a parked,
    unactivated intruder as an airborne contact, so the spotter network woke real SAM sites for an
    aircraft that did not exist — in every mission using late activation.

- id: start-time-does-not-delay-an-air-spawn
  kind: dcs
  area: spawning
  title: "`start_time` on an aircraft group does not delay its spawn"
  measured: "2026-09-21"
  symptom: |
    A group with `start_time = 90` in the mission table was **airborne at t = 9 s**. Late activation
    is no substitute: the group stops being drawn, never stops being seen (entry above).
  workaround: |
    The only real delay is not putting the group in the mission at all, and building it with
    `coalition.addGroup` from a scheduled function.
  cost: Two failed attempts in a row at the same requirement.

- id: mission-clock-is-theatre-local
  kind: dcs
  area: spawning
  title: The mission's `start_time` is on the theatre's clock, with a fixed offset
  measured: "2026-09-24"
  symptom: |
    Caucasus 2022-06-29 at 01:28 is pitch dark (sunrise 01:43 UTC there), so not UTC. GermanyCW,
    Ramstein 1980-06-01 at 04:58 is dawn with the sun not up: UTC+2 (sunrise 03:28 UTC; +1 would
    have put the sun 30 min up). One fixed offset per map — `veafTime.getTimezone()` in game,
    `weather_injector/utils/theatre_offsets.py` at build. Not the IANA zone: DCS models no daylight
    saving time. GermanyCW was measured in June only; whether DCS keeps +2 in winter is not known.
  workaround: |
    Write a mission start time in the theatre's local time; the `sunrise…` / `sunset…` weather
    variants already do (since FIX-SCRATCH-MISSION-FINDINGS 02).
  cost: |
    Every solar-time weather variant of every v6 mission started 2 to 4 hours early until 02 fixed it.

- id: sam-without-ewr-is-lit
  kind: dcs
  area: air-defence
  title: A SAM site with no early-warning radar is not dark — it is permanently lit
  measured: "2026-09-21"
  symptom: |
    A Skynet SAM site is autonomous exactly when no valid parent radar covers it, and autonomous
    means `AUTONOMOUS_STATE_DCS_AI`: removing every EWR hands **all** sites to the DCS AI, which
    lights everything up, all the time.
  workaround: Give a network that must stay dark an EWR covering its sites.
  cost: A test rig built around "no EWR, so only the relay wakes them" delivered every battery lit.

- id: only-two-ewr-types
  kind: dcs
  area: air-defence
  title: Only two unit types carry the `EWR` attribute
  measured: "2026-09-21"
  symptom: |
    `55G6 EWR` and `1L13 EWR`, nothing else. There is no short-range early-warning radar, so an EWR
    parenting a battery also sees everything the battery would.
  workaround: Plan the network around those two types.

- id: battery-wakes-in-its-own-envelope
  kind: dcs
  area: air-defence
  title: A battery lights up only when the contact is in *its own* envelope
  measured: "2026-09-21"
  symptom: |
    Three Kub sites 15 km apart woke in the *same second*: a Kub engages out to ~24 km and the
    intruder entered all three envelopes at once.
  workaround: |
    To stagger wake-ups along a line, space batteries further apart than they can shoot. With the
    spotter radio range at 20 km, that only fits a short-range SAM — Osas (~10 km) 15 km apart wake
    one at a time.

- id: fast-level-aircraft-is-a-harm
  kind: dcs
  area: air-defence
  title: A fast, level aircraft is classified as a HARM — and that is deliberate
  measured: "2026-09-21"
  symptom: |
    An F-15C on a straight, level run at **804.88 kt** was identified by Skynet as an anti-radiation
    missile, and the SAM sites went into evasion and shut down. Skynet's test is `groundSpeed > 800
    kt` **and** at most two flight-path changes (`documentation/tactics.md`), identification being
    probabilistic on top.
  workaround: |
    An aircraft meant to be seen and engaged must stay **below 800 kt** and have a **change of
    altitude** on its route — one dip is enough. DCS lets an aircraft fly well past its waypoint
    speed (the run above was set to ≈390 kt), so the altitude profile is the reliable half.
  cost: The demonstration the SAM sites were there to give was silently defeated.

- id: air-defence-spotters-are-blind
  kind: dcs
  area: air-defence
  title: Half the obvious "forward observers" are blind
  measured: "2026-09-21"
  symptom: |
    `veafSkynet.SpotterUnitTable` is walked in order and the first matching row wins; `SAM elements`
    (range 0) comes before `MANPADS` (10 km):

    | Unit | First row it matches | Sight |
    |---|---|---|
    | `SA-18 Igla-S manpad` | `MANPADS` | 10 000 m |
    | `ZSU-23-4 Shilka`, `Roland ADS` | `SAM elements` | **0 — blind** |
    | `Kub 1S91 str`, `Osa 9A33 ln` | `SAM elements` | **0 — blind** |
    | `Ural-375` | `Unarmed vehicles` | 3 000 m |
  workaround: Use manpads or ordinary vehicles as spotters, not air-defence vehicles.

- id: game-master-marks-are-coalition-scoped
  kind: dcs
  area: players
  title: A game master **is** coalition-scoped for map marks
  measured: "2026-09-21"
  symptom: |
    With one `markToAll` and one `markToCoalition(RED)` marker side by side, a **blue** game master
    sees the `markToAll` marker only, a **red** one sees both. A game master has no group (so no
    `USAGE_ForGroup` radio command reaches him) but he does have a coalition.
  workaround: Watch a red network from a red game-master slot.
  cost: A false bug report against working code, and very nearly a "fix" to a correct drawing path.

- id: no-parking-data-outside-three-theatres
  kind: tool
  area: mcp
  title: No ramp or runway start through the MCP outside Caucasus, Persian Gulf and Syria
  symptom: |
    `add_air_group` with a `parking-*` or `runway` start is refused with *"no parking data captured
    for theatre …"* on every other map (GermanyCW, Nevada, Normandy, Sinai…): only those three
    theatres ship a parking capture in `veaf_libs/data/parking/`.
  workaround: |
    Use an air start there, or place the flight in the DCS Mission Editor. The capture itself is a
    session in DCS: `veaf-tools dcs capture-map --parking`.
