# VEAF framework spawn data — source of truth for veafUnits.UnitsDatabase
# and veafUnits.GroupsDatabase. Rendered to a Lua module and injected into
# the .miz at mission build (veaf-tools build). See ADR 0005.
#
# units:  alias -> DCS unit type, for `_spawn unit <alias>`.
# groups: composite groups (SAM sites, convoys, ...), for `_spawn group <alias>`.
#   disposition: {h, w} layout grid in cells (a cell is 10m x 10m).
#   units[].cell: preferred grid cell; number: count or {min, max} random range;
#   hdg: heading; size: fixed cell size (m); random: randomize within cell;
#   fitToUnit: shrink the cell to the unit's exact footprint.
#   hidden: keep out of generated documentation listings.

