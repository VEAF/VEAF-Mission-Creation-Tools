# Démonstration de FEAT-CUSTOM-SCRIPT-LOAD-DELAY : un script chargé en différé, dans son propre
# trigger, `delay_seconds` après le début de mission — ce qu'une mission v5 ne pouvait pas déclarer.
custom_scripts:
  scripts:
    - path: src/scripts/demo-delayed-hello.lua
      delay_seconds: 10   # chargé 10 s après le début, pas à t=0 avec le reste

